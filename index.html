<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Neytron | Strategic System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>

:root{
    --bg:#030712;
    --card:#0f172a;
    --accent:#22d3ee;
    --accent2:#8b5cf6;

    --p1:#ef4444;
    --p2:#f59e0b;
    --p3:#10b981;

    --text:#f1f5f9;
    --border:rgba(255,255,255,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    padding:15px;
}

/* BACKGROUND GLOW */

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:rgba(34,211,238,0.08);
    filter:blur(120px);
    top:-200px;
    right:-100px;
    z-index:-1;
}

body::after{
    content:'';
    position:fixed;
    width:450px;
    height:450px;
    background:rgba(139,92,246,0.08);
    filter:blur(120px);
    bottom:-200px;
    left:-100px;
    z-index:-1;
}

/* LOADING */

#loading-screen{
    position:fixed;
    inset:0;
    background:#030712;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999999;
    transition:0.6s;
}

.loader-box{
    text-align:center;
}

.loader-ring{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,0.08);
    border-top:4px solid var(--accent);
    animation:spin 1s linear infinite;
    margin:auto;
}

.loader-box h1{
    margin-top:25px;
    letter-spacing:10px;
    color:var(--accent);
    font-size:40px;
}

.loader-box p{
    margin-top:10px;
    opacity:0.5;
    font-size:12px;
    letter-spacing:2px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center,#0f172a 0%,#030712 100%);
    z-index:1000;
}

.login-box{
    width:90%;
    max-width:400px;
    background:rgba(15,23,42,0.6);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:30px;
    text-align:center;
}

.login-box h1{
    color:var(--accent);
    letter-spacing:8px;
    font-size:40px;
}

.login-box p{
    margin-top:10px;
    opacity:0.5;
    font-size:12px;
    letter-spacing:1px;
}

.google-btn{
    margin-top:30px;
    width:100%;
    border:none;
    padding:16px;
    border-radius:18px;
    font-weight:900;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:0.25s;
}

.google-btn:hover{
    transform:translateY(-2px);
}

/* MAIN */

#main-app{
    display:none;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(15,23,42,0.75);
    border:1px solid var(--border);

    padding:15px 18px;
    border-radius:24px;

    position:sticky;
    top:10px;
    z-index:100;

    backdrop-filter:blur(20px);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.03);

    margin-bottom:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    font-weight:900;
    letter-spacing:4px;
    color:var(--accent);
}

.atom-core{
    animation:spin 4s linear infinite;
}

.header-controls{
    display:flex;
    align-items:center;
    gap:12px;
}

#pDate{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    color:var(--accent);

    padding:8px 12px;
    border-radius:14px;

    outline:none;
    font-weight:800;
}

.user-avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--accent);
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}

@media(min-width:1000px){
    .dashboard{
        grid-template-columns:420px 1fr;
    }
}

.panel{
    background:rgba(15,23,42,0.72);

    border:1px solid var(--border);

    border-radius:28px;
    padding:24px;

    backdrop-filter:blur(18px);

    transition:0.3s;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.03);
}

.panel:hover{
    transform:translateY(-3px);
    border-color:rgba(34,211,238,0.2);
}

.label-sm{
    display:block;
    margin-bottom:15px;

    color:var(--accent);

    font-size:10px;
    font-weight:800;

    letter-spacing:2px;
    text-transform:uppercase;

    opacity:0.6;
}

/* MODE */

.mode-selector{
    display:flex;
    gap:10px;
    margin-bottom:22px;
}

.mode-btn{
    flex:1;

    border:none;
    border-radius:16px;

    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);

    color:#64748b;

    padding:14px;
    cursor:pointer;

    font-size:11px;
    font-weight:900;

    transition:0.25s;
}

.mode-btn.active{
    background:var(--accent);
    color:#000;

    box-shadow:0 10px 25px rgba(34,211,238,0.3);
}

.mode-btn:hover{
    transform:translateY(-2px);
}

/* RESOURCES */

.res-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
}

.res-item{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--border);

    border-radius:20px;
    padding:15px;
}

.res-item label{
    display:block;
    margin-bottom:6px;

    font-size:9px;
    opacity:0.5;
    font-weight:800;
}

.res-item input{
    width:100%;
    border:none;
    background:transparent;

    color:#fff;
    font-size:22px;
    font-weight:900;

    outline:none;
}

/* INPUT EFFECT */

input{
    transition:0.25s;
}

input:focus{
    box-shadow:0 0 15px rgba(34,211,238,0.25);
}

/* ZONES */

.zone-card{
    position:relative;

    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);

    border-radius:20px;
    padding:14px;

    margin-bottom:12px;

    transition:0.25s;
}

.zone-card:hover{
    transform:translateY(-2px);
    border-color:rgba(34,211,238,0.2);
}

.zone-main{
    display:flex;
    align-items:center;
    gap:12px;
}

.zone-card .name{
    flex:1;

    background:transparent;
    border:none;

    color:#fff;

    font-size:15px;
    font-weight:700;

    outline:none;
}

.zone-card .time{
    width:80px;

    background:#030712;
    border:1px solid var(--border);

    color:var(--accent);

    padding:10px;
    border-radius:12px;

    text-align:center;
    font-weight:900;
}

/* PRIORITY */

.p-indicator{
    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--border);

    cursor:pointer;
}

.p1{
    color:var(--p1);
    border-color:var(--p1);
}

.p2{
    color:var(--p2);
    border-color:var(--p2);
}

.p3{
    color:var(--p3);
    border-color:var(--p3);
}

.p-overlay{
    display:none;

    position:absolute;
    inset:0;

    background:var(--card);

    border-radius:20px;

    align-items:center;
    justify-content:space-around;

    border:1px solid var(--accent);

    z-index:20;
}

.p-opt{
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

/* BUTTONS */

.btn-run{
    width:100%;
    margin-top:20px;

    border:none;
    border-radius:20px;

    background:linear-gradient(90deg,var(--accent),var(--accent2));

    color:#000;

    padding:18px;

    font-size:15px;
    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    transition:0.25s;
}

.btn-run:hover{
    transform:translateY(-2px);
}

.btn-add{
    width:100%;
    margin-top:10px;

    background:transparent;

    border:2px dashed var(--border);

    color:#64748b;

    padding:15px;
    border-radius:18px;

    cursor:pointer;

    font-weight:700;

    transition:0.25s;
}

.btn-add:hover{
    border-color:var(--accent);
    color:var(--accent);
}

/* CHART */

.chart-container{
    position:relative;
    height:330px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.balans-center{
    position:absolute;
    text-align:center;
    pointer-events:none;
}

.balans-center h1{
    font-size:54px;
    font-weight:900;
    color:var(--accent);
}

.balans-center p{
    margin-top:5px;

    font-size:10px;
    letter-spacing:3px;

    opacity:0.4;
}

/* PROGRESS */

.progress-wrap{
    width:100%;
    height:14px;

    background:#111827;

    border-radius:30px;
    overflow:hidden;

    border:1px solid var(--border);

    margin-top:15px;
    margin-bottom:20px;
}

#progress-bar{
    width:0%;
    height:100%;

    background:linear-gradient(90deg,#22d3ee,#8b5cf6);

    border-radius:30px;

    transition:0.4s;
}

/* AI */

.ai-card{
    position:relative;
    overflow:hidden;

    background:rgba(255,255,255,0.03);

    border:1px solid var(--border);
    border-left:5px solid var(--accent);

    border-radius:20px;

    padding:20px;

    margin-bottom:14px;

    transition:0.3s;
}

.ai-card:hover{
    transform:translateY(-3px);
}

.ai-card::before{
    content:'';
    position:absolute;

    width:200px;
    height:200px;

    background:rgba(255,255,255,0.03);

    border-radius:50%;

    top:-120px;
    right:-120px;
}

.ai-card h6{
    font-size:11px;
    letter-spacing:1px;

    color:var(--accent);

    margin-bottom:10px;
}

.ai-card p{
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

.ai-card.crit{
    border-left-color:var(--p1);
}

.ai-card.sport{
    border-left-color:var(--p2);
}

/* TOAST */

#toast{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:var(--accent);

    color:#000;

    padding:15px 24px;

    border-radius:16px;

    font-weight:900;

    opacity:0;
    pointer-events:none;

    transition:0.35s;

    z-index:99999;

    box-shadow:0 10px 30px rgba(34,211,238,0.35);
}

#toast.show{
    opacity:1;
    bottom:40px;
}

</style>
</head>
<body>

<div id="loading-screen">
    <div class="loader-box">
        <div class="loader-ring"></div>
        <h1>NEYTRON</h1>
        <p>Strategik tizim yuklanmoqda...</p>
    </div>
</div>

<div id="toast"></div>

<div id="login-screen">
    <div class="login-box">
        <h1>NEYTRON</h1>
        <p>Strategik rejalashtirish tizimi</p>

        <button class="google-btn" onclick="window.signIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Google orqali kirish
        </button>
    </div>
</div>

<div id="main-app">

<header>
    <div class="brand">
        <i class="fa-solid fa-atom atom-core"></i>
        NEYTRON
    </div>

    <div class="header-controls">
        <input type="date" id="pDate" onchange="window.loadData()">

        <div class="user-avatar" id="user-p"></div>

        <i class="fa-solid fa-right-from-bracket"
           style="opacity:0.3; cursor:pointer;"
           onclick="window.logout()"></i>
    </div>
</header>

<div class="dashboard">

<section class="panel">

<span class="label-sm">Aqliy yuklama darajasi</span>

<div class="mode-selector">
    <button class="mode-btn" id="m1.5" onclick="setMode(1.5,this)">OSON</button>
    <button class="mode-btn active" id="m3.0" onclick="setMode(3.0,this)">O'RTACHA</button>
    <button class="mode-btn" id="m5.0" onclick="setMode(5.0,this)">QIYIN</button>
</div>

<span class="label-sm">Asosiy Resurslar</span>

<div class="res-grid">

<div class="res-item">
<label>UYQU</label>
<input type="number" id="sH" value="8" step="0.5" oninput="updateUI()">
</div>

<div class="res-item">
<label>ISH / O'QISH</label>
<input type="number" id="wH" value="8" step="0.5" oninput="updateUI()">
</div>

</div>

<span class="label-sm">Vaqt Zonalari</span>

<div id="zList"></div>

<button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>

<button class="btn-run" onclick="window.saveData()">
    STRATEGIK SAQLASH
</button>

</section>

<section class="panel">

<span class="label-sm">Vaqt Balansi</span>

<div class="chart-container">
    <canvas id="nChart"></canvas>

    <div class="balans-center">
        <h1 id="balText">08:00</h1>
        <p>BO'SH VAQT</p>
    </div>
</div>

<div class="progress-wrap">
    <div id="progress-bar"></div>
</div>

<div id="aiHub"></div>

</section>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getAuth,
signInWithPopup,
GoogleAuthProvider,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

setPersistence(auth, browserLocalPersistence);

window.signIn = () => signInWithPopup(auth, provider);

window.logout = () => {
    if(confirm("Tizimdan chiqmoqchimisiz?")){
        signOut(auth);
    }
};

onAuthStateChanged(auth, (user) => {

    if(user){

        document.getElementById('login-screen').style.display='none';
        document.getElementById('main-app').style.display='block';

        if(user.photoURL){
            document.getElementById('user-p').innerHTML =
            `<img src="${user.photoURL}" style="width:100%;height:100%">`;
        }

        window.loadData();

    }else{

        document.getElementById('login-screen').style.display='flex';
        document.getElementById('main-app').style.display='none';

    }

});

window.saveData = async () => {

    const user = auth.currentUser;
    if(!user) return;

    const date = document.getElementById('pDate').value;

    const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
        n:z.querySelector('.name').value,
        t:z.querySelector('.time').value,
        p:z.dataset.p
    }));

    try{

        await setDoc(doc(db,"users",user.uid,"plans",date),{

            sleep:document.getElementById('sH').value,
            work:document.getElementById('wH').value,
            complexity:window.complexity,
            zones:zones

        });

        showToast("Strategik reja saqlandi");
        analyze();

    }catch(e){

        showToast("Xatolik yuz berdi");

    }

};

window.loadData = async () => {

    const user = auth.currentUser;
    if(!user) return;

    const date = document.getElementById('pDate').value;

    const docSnap = await getDoc(doc(db,"users",user.uid,"plans",date));

    document.getElementById('zList').innerHTML='';

    if(docSnap.exists()){

        const data = docSnap.data();

        document.getElementById('sH').value = data.sleep;
        document.getElementById('wH').value = data.work;

        setMode(data.complexity || 3.0,null,false);

        if(data.zones){
            data.zones.forEach(z =>
                addZ(z.n,z.t,z.p,false)
            );
        }

    }else{

        addZ('', '', 'p2', false);

    }

    updateUI();
    analyze();

};

</script>

<script>

let chart;
window.complexity = 3.0;

document.getElementById('pDate').valueAsDate = new Date();

/* TOAST */

window.showToast = (text) => {

    const toast = document.getElementById('toast');

    toast.innerText = text;

    toast.classList.add('show');

    setTimeout(() => {
        toast.classList.remove('show');
    },2200);

};

/* LOADING */

window.addEventListener('load',()=>{

    setTimeout(()=>{

        document.getElementById('loading-screen').style.opacity='0';

        setTimeout(()=>{
            document.getElementById('loading-screen').style.display='none';
        },600);

    },1200);

});

/* MODE */

window.setMode = (val,btn,shouldSync=true)=>{

    window.complexity = val;

    document.querySelectorAll('.mode-btn')
    .forEach(b=>b.classList.remove('active'));

    if(btn){
        btn.classList.add('active');
    }else{
        const target=document.getElementById('m'+val.toFixed(1));
        if(target) target.classList.add('active');
    }

    if(shouldSync) updateUI();

};

/* ADD ZONE */

window.addZ = (n='',m='',p='p2',shouldSync=true)=>{

    const id = Date.now() + Math.random();

    const div = document.createElement('div');

    div.className='zone-card';
    div.id=`z-${id}`;
    div.dataset.p=p;

    div.innerHTML=`

    <div class="zone-main">

        <div class="p-indicator ${p}" onclick="showP(${id})">
            <i class="fa-solid fa-flag"></i>
        </div>

        <input type="text"
               class="name"
               placeholder="Maqsad..."
               value="${n}"
               oninput="updateUI()">

        <input type="number"
               class="time"
               placeholder="min"
               value="${m}"
               oninput="validateTime(this)">

        <i class="fa-solid fa-trash-can"
           style="opacity:0.25; cursor:pointer;"
           onclick="remZ(${id})"></i>

    </div>

    <div class="p-overlay" id="ov-${id}">

        <div class="p-opt"
             style="color:var(--p1)"
             onclick="selP(${id},'p1')">
             P1
        </div>

        <div class="p-opt"
             style="color:var(--p2)"
             onclick="selP(${id},'p2')">
             P2
        </div>

        <div class="p-opt"
             style="color:var(--p3)"
             onclick="selP(${id},'p3')">
             P3
        </div>

    </div>

    `;

    document.getElementById('zList').appendChild(div);

    if(shouldSync) updateUI();

};

/* PRIORITY */

window.showP = (id)=>{
    document.getElementById(`ov-${id}`).style.display='flex';
};

window.selP = (id,p)=>{

    const z=document.getElementById(`z-${id}`);

    z.dataset.p=p;

    z.querySelector('.p-indicator').className=
    `p-indicator ${p}`;

    document.getElementById(`ov-${id}`).style.display='none';

    updateUI();

};

/* REMOVE */

window.remZ = (id)=>{

    if(confirm("O'chirasizmi?")){

        document.getElementById(`z-${id}`).remove();

        updateUI();

    }

};

/* VALIDATE */

window.validateTime = (input)=>{

    const s=(+document.getElementById('sH').value || 0)*60;
    const w=(+document.getElementById('wH').value || 0)*60;

    let other=0;

    document.querySelectorAll('.zone-card').forEach(z=>{

        if(z.querySelector('.time') !== input){

            other += (+z.querySelector('.time').value || 0);

        }

    });

    const max = 1440 - (s+w+other);

    if(+input.value > max){

        input.value = Math.max(0,max);

    }

    updateUI();

};

/* UI */

window.updateUI = ()=>{

    const s=(+document.getElementById('sH').value || 0)*60;
    const w=(+document.getElementById('wH').value || 0)*60;

    let labs=['Uyqu','Ish'];
    let vals=[s,w];

    let total=s+w;

    document.querySelectorAll('.zone-card').forEach(z=>{

        labs.push(z.querySelector('.name').value || 'Vazifa');

        const v=+z.querySelector('.time').value || 0;

        vals.push(v);

        total += v;

    });

    const bal=Math.max(0,1440-total);

    labs.push("Bo'sh");
    vals.push(bal);

    document.getElementById('balText').innerText =
    `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

    const usedPercent=(total/1440)*100;

    document.getElementById('progress-bar').style.width =
    usedPercent + '%';

    if(!chart){

        chart = new Chart(
            document.getElementById('nChart').getContext('2d'),
            {

            type:'doughnut',

            data:{

                labels:labs,

                datasets:[{

                    data:vals,

                    backgroundColor:[
                        '#1e293b',
                        '#334155',
                        '#ef4444',
                        '#f59e0b',
                        '#10b981',
                        '#22d3ee',
                        '#8b5cf6',
                        '#475569'
                    ],

                    borderWidth:0

                }]

            },

            options:{

                cutout:'82%',

                responsive:true,
                maintainAspectRatio:false,

                plugins:{
                    legend:{
                        display:false
                    }
                }

            }

        });

    }else{

        chart.data.labels=labs;
        chart.data.datasets[0].data=vals;

        chart.update('none');

    }

};

/* AI */

window.analyze = ()=>{

    const hub=document.getElementById('aiHub');

    hub.innerHTML='';

    const sleep=+document.getElementById('sH').value;
    const work=+document.getElementById('wH').value;

    if(sleep < 6 && work > 9){

        hub.innerHTML += `
        <div class="ai-card crit">
            <h6>Burnout xavfi</h6>
            <p>Uyqu kam va yuklama yuqori. Tiklanish uchun dam olish kerak.</p>
        </div>`;
    }

    document.querySelectorAll('.zone-card').forEach(z=>{

        const n=z.querySelector('.name').value.toLowerCase();

        const t=+z.querySelector('.time').value;

        if((n.includes('kitob') || n.includes('mutolaa')) && t > 0){

            hub.innerHTML += `
            <div class="ai-card">
                <h6>Mutolaa Strategiyasi</h6>
                <p>Bugun ${Math.floor(t/window.complexity)} bet o'qish mumkin.</p>
            </div>`;
        }

        else if((n.includes('sport') || n.includes('mashq')) && t > 0){

            hub.innerHTML += `
            <div class="ai-card sport">
                <h6>Jismoniy Faollik</h6>
                <p>${t} daqiqa sport energiya balansini yaxshilaydi.</p>
            </div>`;
        }

        else if(z.dataset.p === 'p1' && t > 0){

            hub.innerHTML += `
            <div class="ai-card crit">
                <h6>Kritik Fokus</h6>
                <p>${n.toUpperCase()} bugungi asosiy strategik vazifa.</p>
            </div>`;
        }

    });

};

</script>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron | Strategic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 12px; overflow-x: hidden; }

        /* Login Screen */
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: var(--bg); }
        .login-box { text-align: center; padding: 40px; border-radius: 30px; background: var(--card); border: 1px solid var(--border); width: 90%; max-width: 400px; }
        .google-btn { background: #fff; color: #000; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px; }

        #main-app { display: none; max-width: 500px; margin: 0 auto; }

        /* Header Fix */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 10px 15px; border-radius: 18px; 
            border: 1px solid var(--border); margin-bottom: 15px;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        #pDate { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            color: var(--accent); padding: 5px 8px; border-radius: 10px; 
            font-size: 13px; font-weight: 700; outline: none;
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); overflow: hidden; }

        .panel { background: var(--card); border-radius: 22px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        .label-sm { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; opacity: 0.6; }

        /* Zone Card Fix */
        .zone-card { background: rgba(0,0,0,0.2); border-radius: 15px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); position: relative; }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        .zone-card input.name { background: transparent; border: none; color: #fff; flex: 1; font-size: 14px; outline: none; }
        .zone-card input.time { width: 65px; background: #030712; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; color: var(--accent); font-weight: 800; }

        /* Priority Colors */
        .p-indicator { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); }
        .p-indicator.p1 { color: var(--p1); border-color: var(--p1); }
        .p-indicator.p2 { color: var(--p2); border-color: var(--p2); }
        .p-indicator.p3 { color: var(--p3); border-color: var(--p3); }

        .p-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card); border-radius: 15px; align-items: center; justify-content: space-around; z-index: 10; }

        /* Universal Analytics */
        .ai-card { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        .loss-warning { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--p1); color: var(--p1); padding: 15px; border-radius: 15px; margin-bottom: 15px; font-size: 13px; font-weight: 700; line-height: 1.4; }

        .btn-run { background: var(--accent); color: #000; width: 100%; padding: 16px; border-radius: 15px; font-weight: 900; border: none; cursor: pointer; margin-top: 10px; }
        .btn-add { background: transparent; border: 1px dashed var(--border); color: #64748b; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin: 10px 0; font-weight: 700; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="letter-spacing: 5px; color: var(--accent);">NEYTRON</h2>
        <button class="google-btn" onclick="window.signIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google orqali kirish
        </button>
    </div>
</div>

<div id="main-app">
    <header>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 16px; color: var(--accent);">NEYTRON</div>
        <div class="header-right">
            <input type="date" id="pDate" onchange="window.loadData()">
            <div class="user-avatar" id="user-p"></div>
            <i class="fa-solid fa-power-off" style="opacity:0.3" onclick="window.logout()"></i>
        </div>
    </header>

    <div class="panel">
        <span class="label-sm">Asosiy Resurslar (Soat)</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="number" id="sH" value="8" style="background:#030712; border:1px solid var(--border); color:#fff; padding:10px; border-radius:10px; text-align:center;">
            <input type="number" id="wH" value="8" style="background:#030712; border:1px solid var(--border); color:#fff; padding:10px; border-radius:10px; text-align:center;">
        </div>
    </div>

    <div class="panel">
        <span class="label-sm">Vaqt Zonalari (Daqiqa)</span>
        <div id="zList"></div>
        <button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>
        <button class="btn-run" onclick="window.saveData()">STRATEGIK SAQLASH</button>
    </div>

    <div class="panel">
        <span class="label-sm">Balans va Yillik Tahlil</span>
        <div style="height: 250px; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <canvas id="nChart"></canvas>
            <div style="position: absolute; text-align: center;">
                <h1 id="balText" style="font-size: 40px; color: var(--accent);">08:00</h1>
                <p style="font-size: 10px; opacity: 0.5;">BO'SH VAQT</p>
            </div>
        </div>
        <div id="aiHub"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // AVTOMATIK KIRISHNI YOQISH [cite: 2026-03-23]
    setPersistence(auth, browserLocalPersistence);

    window.signIn = () => signInWithPopup(auth, provider);
    window.logout = () => { if(confirm("Chiqmoqchimisiz?")) signOut(auth); };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%">`;
            window.loadData();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
        }
    });

    window.saveData = async () => {
        const user = auth.currentUser;
        if (!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));

        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        alert("Strategiya saqlandi!");
        window.analyze();
    };

    window.loadData = async () => {
        const user = auth.currentUser;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const d = docSnap.data();
            document.getElementById('sH').value = d.sleep;
            document.getElementById('wH').value = d.work;
            d.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        } else {
            window.addZ('', '', 'p2');
        }
        window.updateUI(); window.analyze();
    };
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.addZ = (n='', t='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card';
        div.id = `z-${id}`;
        div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" oninput="updateUI()">
                <input type="number" placeholder="min" class="time" value="${t}" oninput="updateUI()">
                <i class="fa-solid fa-xmark" style="opacity:0.2" onclick="remZ(${id})"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:var(--p1)">P1</div>
                <div onclick="selP(${id},'p2')" style="color:var(--p2)">P2</div>
                <div onclick="selP(${id},'p3')" style="color:var(--p3)">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };
    window.remZ = (id) => { document.getElementById(`z-${id}`).remove(); updateUI(); };

    window.updateUI = () => {
        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;
        let total = s + w;
        document.querySelectorAll('.zone-card').forEach(z => { total += (+z.querySelector('.time').value || 0); });
        
        const bal = Math.max(0, 1440 - total);
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        if (!chart) {
            chart = new Chart(document.getElementById('nChart'), {
                type: 'doughnut',
                data: { datasets: [{ data: [s, w, total-(s+w), bal], backgroundColor: ['#1e293b', '#334155', '#ef4444', '#22d3ee'] }] },
                options: { cutout: '85%', plugins: { legend: { display: false } } }
            });
        } else {
            chart.data.datasets[0].data = [s, w, total-(s+w), bal];
            chart.update();
        }
        window.analyze(bal);
    };

    window.analyze = (balMin) => {
        const hub = document.getElementById('aiHub');
        hub.innerHTML = '';
        
        if (balMin > 0) {
            const yearlyLoss = Math.floor((balMin * 365) / 60);
            hub.innerHTML += `<div class="loss-warning">DIQQAT: Ushbu bo'sh vaqt bilan bir yilda naqd ${yearlyLoss} soatni (taxminan ${Math.floor(yearlyLoss/24)} kunni) boy berishingiz mumkin!</div>`;
        }

        document.querySelectorAll('.zone-card').forEach(z => {
            const n = z.querySelector('.name').value;
            const t = +z.querySelector('.time').value;
            if (t > 0 && n) {
                hub.innerHTML += `<div class="ai-card" style="border-left-color: var(--${z.dataset.p})">
                    <h6>${n.toUpperCase()}</h6>
                    <p>Kunlik vaqtingizning ${(t/14.4).toFixed(1)}% qismini egallamoqda.</p>
                </div>`;
            }
        });
    };
</script>
</body>
</html>

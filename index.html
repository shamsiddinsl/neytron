<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron | Smart Strategic System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 10px; line-height: 1.4; overflow-x: hidden; }

        /* Mobil interfeysni ixchamlashtirish */
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .login-box { text-align: center; padding: 30px; border-radius: 24px; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); backdrop-filter: blur(10px); width: 90%; max-width: 380px; }
        
        #main-app { display: none; max-width: 1100px; margin: 0 auto; padding-bottom: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 15px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .brand { font-weight: 900; font-size: 16px; letter-spacing: 3px; color: var(--accent); }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 1024px) { .dashboard { grid-template-columns: 400px 1fr; } }

        .panel { background: var(--card); border-radius: 20px; padding: 18px; border: 1px solid var(--border); }
        .label-sm { font-size: 9px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; display: block; opacity: 0.6; }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .res-item { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 14px; border: 1px solid var(--border); }
        .res-item label { font-size: 8px; opacity: 0.5; display: block; margin-bottom: 2px; }
        .res-item input { background: transparent; border: none; color: #fff; width: 100%; font-weight: 800; font-size: 16px; outline: none; }

        .zone-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 10px; position: relative; }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        .zone-card input.name { background: transparent; border: none; color: #fff; outline: none; font-size: 14px; flex: 1; min-width: 0; }
        .zone-card input.time { width: 60px; background: #030712; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; font-weight: 800; color: var(--accent); outline: none; font-size: 13px; }

        .p-indicator { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); font-size: 12px; flex-shrink: 0; }
        .p-indicator.p1 { border-color: var(--p1); color: var(--p1); }
        .p-indicator.p2 { border-color: var(--p2); color: var(--p2); }
        .p-indicator.p3 { border-color: var(--p3); color: var(--p3); }

        .p-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card); border-radius: 16px; align-items: center; justify-content: space-around; z-index: 10; border: 1px solid var(--accent); }
        .p-opt { font-weight: 800; font-size: 11px; cursor: pointer; text-align: center; line-height: 1.2; }

        .chart-container { position: relative; height: 280px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .balans-center { position: absolute; text-align: center; pointer-events: none; }
        .balans-center h1 { font-size: 40px; font-weight: 900; color: var(--accent); line-height: 1; }

        .ai-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        .ai-card h6 { font-size: 10px; color: var(--accent); margin-bottom: 5px; text-transform: uppercase; }
        .ai-card p { font-size: 12px; color: #94a3b8; }
        .lost-stat { color: var(--p1); font-weight: 800; }

        .btn-run { background: var(--accent); color: #000; width: 100%; padding: 15px; border-radius: 15px; font-weight: 900; border: none; cursor: pointer; margin-top: 15px; font-size: 14px; }
        .btn-add { background: transparent; border: 1px dashed var(--border); color: #475569; width: 100%; padding: 12px; border-radius: 14px; cursor: pointer; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="letter-spacing: 5px; color: var(--accent); margin-bottom: 10px;">NEYTRON</h1>
        <button class="btn-run" onclick="window.signIn()"><i class="fa-brands fa-google"></i> Google orqali kirish</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div class="brand">NEYTRON</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="date" id="pDate" onchange="window.loadData()" style="background:transparent; border:1px solid var(--border); color:var(--accent); border-radius:8px; padding:4px; font-size:11px;">
            <div id="user-p" style="width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 1px solid var(--accent);"></div>
        </div>
    </header>

    <div class="dashboard">
        <section class="panel">
            <span class="label-sm">Asosiy Resurslar</span>
            <div class="res-grid">
                <div class="res-item"><label>UYQU</label><input type="number" id="sH" value="8" step="0.5" oninput="updateUI()"></div>
                <div class="res-item"><label>ISH</label><input type="number" id="wH" value="8" step="0.5" oninput="updateUI()"></div>
            </div>

            <span class="label-sm">Rejalar (Daqiqa)</span>
            <div id="zList"></div>
            <button class="btn-add" onclick="addZ()">+ YANGI REJA</button>
            <button class="btn-run" onclick="window.saveData()">SAQLASH</button>
        </section>

        <section class="panel">
            <div class="chart-container">
                <canvas id="nChart"></canvas>
                <div class="balans-center">
                    <h1 id="balText">08:00</h1>
                    <p style="font-size: 8px; opacity: 0.5;">BO'SH VAQT</p>
                </div>
            </div>
            <div id="aiHub"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence);

    window.signIn = () => signInWithRedirect(auth, provider);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%">`;
            window.loadData();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.saveData = async () => {
        const user = auth.currentUser;
        if(!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));
        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        alert("Saqlandi!");
    };

    window.loadData = async () => {
        const user = auth.currentUser;
        if (!user) return;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('sH').value = data.sleep;
            document.getElementById('wH').value = data.work;
            if(data.zones) data.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        } else { window.addZ('', '', 'p2'); }
        updateUI();
    };
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.addZ = (n='', m='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card';
        div.id = `z-${id}`;
        div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Vazifa nomi..." class="name" value="${n}" oninput="updateUI()">
                <input type="number" class="time" value="${m}" oninput="updateUI()">
                <i class="fa-solid fa-xmark" style="opacity:0.2" onclick="document.getElementById('z-${id}').remove(); updateUI();"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div class="p-opt" style="color:var(--p1)" onclick="selP(${id},'p1')">MUHIM<br>(High)</div>
                <div class="p-opt" style="color:var(--p2)" onclick="selP(${id},'p2')">O'RTACHA<br>(Mid)</div>
                <div class="p-opt" style="color:var(--p3)" onclick="selP(${id},'p3')">ODDIY<br>(Low)</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };

    window.updateUI = () => {
        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;
        let vals = [s, w], colors = ['#1e293b', '#334155'], total = s + w;

        document.querySelectorAll('.zone-card').forEach(z => {
            const v = +z.querySelector('.time').value || 0;
            vals.push(v); total += v;
            const p = z.dataset.p;
            colors.push(p === 'p1' ? '#ef4444' : p === 'p2' ? '#d97706' : '#10b981');
        });

        const bal = Math.max(0, 1440 - total);
        vals.push(bal); colors.push('rgba(34, 211, 238, 0.1)');
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('nChart').getContext('2d'), {
            type: 'doughnut',
            data: { datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
            options: { cutout: '85%', animation: false, plugins: { tooltip: { enabled: false } } }
        });

        // Universal Analitika va Prognoz
        const hub = document.getElementById('aiHub');
        const lostYearMin = bal * 365;
        const lostHours = Math.floor(lostYearMin / 60);
        const lostDays = (lostYearMin / 1440).toFixed(1);

        hub.innerHTML = `
            <div class="ai-card">
                <h6>Vaqt yo'qotish prognozi</h6>
                <p>Agar har kuni ushbu bo'sh vaqtdan foydalanmasangiz, bir yilda <span class="lost-stat">${lostHours} soat</span> yo'qotasiz. 
                Bu hayotingizning sof <span class="lost-stat">${lostDays} kuniga</span> teng!</p>
            </div>
        `;

        document.querySelectorAll('.zone-card').forEach(z => {
            const name = z.querySelector('.name').value;
            if(z.dataset.p === 'p1' && name) {
                hub.innerHTML += `<div class="ai-card" style="border-left-color:var(--p1)">
                    <h6>Kritik Fokus</h6>
                    <p>"${name}" - bugungi eng ustuvor vazifangiz. Barcha resursni shunga qarating.</p>
                </div>`;
            }
        });
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron | Optimized UX</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #fbbf24; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }

        /* Konteyner va Ramkalar Fix */
        #main-app { max-width: 480px; margin: 0 auto; overflow: hidden; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 12px 16px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 20px;
        }

        .panel { 
            background: var(--card); border-radius: 24px; padding: 20px; 
            border: 1px solid var(--border); margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Vazifa Kartochkalari */
        .zone-card { 
            background: rgba(255,255,255,0.03); border-radius: 18px; 
            padding: 14px; margin-bottom: 12px; border: 1px solid var(--border);
            position: relative; transition: 0.3s;
        }

        .zone-main { display: flex; align-items: center; gap: 12px; }
        
        /* Ustuvorlik belgilari (P1, P2, P3) Fix */
        .p-indicator { 
            width: 42px; height: 42px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border: 2px solid transparent;
            font-weight: 900; font-size: 14px; transition: 0.2s;
        }
        .p-indicator.p1 { background: rgba(239, 68, 68, 0.15); color: var(--p1); border-color: rgba(239, 68, 68, 0.3); }
        .p-indicator.p2 { background: rgba(251, 191, 36, 0.15); color: var(--p2); border-color: rgba(251, 191, 36, 0.3); }
        .p-indicator.p3 { background: rgba(16, 185, 129, 0.15); color: var(--p3); border-color: rgba(16, 185, 129, 0.3); }

        .p-overlay { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--card); border-radius: 18px; align-items: center; 
            justify-content: space-around; z-index: 10; border: 1px solid var(--accent);
        }

        /* Inputlar */
        input.name { background: transparent; border: none; color: #fff; flex: 1; font-size: 15px; outline: none; }
        input.time { 
            width: 70px; background: #030712; border: 1px solid var(--border); 
            border-radius: 10px; padding: 8px; text-align: center; 
            color: var(--accent); font-weight: 800; 
        }

        .btn-run { 
            background: var(--accent); color: #030712; width: 100%; 
            padding: 18px; border-radius: 18px; font-weight: 900; 
            border: none; cursor: pointer; margin-top: 10px;
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.2);
        }
        
        .loss-warning {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--p1);
            color: var(--p1); padding: 16px; border-radius: 18px; margin-top: 15px;
            font-size: 13px; font-weight: 700; line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="main-app">
    <header>
        <div style="font-weight: 900; letter-spacing: 2px; color: var(--accent);">NEYTRON</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="date" id="pDate" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 6px; border-radius: 10px; font-size: 12px; outline: none;">
            <div id="user-avatar" style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--accent); overflow: hidden; background: #1e293b;"></div>
        </div>
    </header>

    <div class="panel">
        <span style="font-size: 10px; font-weight: 800; color: var(--accent); opacity: 0.6; text-transform: uppercase;">Resurslar (Soat)</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px;">
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 4px;">UYQU</label>
                <input type="number" id="sH" value="8" style="background: transparent; border: none; color: #fff; text-align: center; font-weight: 800; font-size: 18px; width: 100%; outline: none;">
            </div>
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 4px;">ISH</label>
                <input type="number" id="wH" value="8" style="background: transparent; border: none; color: #fff; text-align: center; font-weight: 800; font-size: 18px; width: 100%; outline: none;">
            </div>
        </div>
    </div>

    <div class="panel">
        <span style="font-size: 10px; font-weight: 800; color: var(--accent); opacity: 0.6; text-transform: uppercase;">Vaqt Zonalari (Daqiqa)</span>
        <div id="zList" style="margin-top: 12px;"></div>
        <button onclick="addZ()" style="background: transparent; border: 1px dashed var(--border); color: #64748b; width: 100%; padding: 14px; border-radius: 15px; font-weight: 700; margin-bottom: 10px;">+ YANGI ZONA</button>
        <button class="btn-run" onclick="saveData()">STRATEGIK SAQLASH</button>
    </div>

    <div class="panel" style="text-align: center;">
        <span style="font-size: 10px; font-weight: 800; color: var(--accent); opacity: 0.6; text-transform: uppercase;">Analitika</span>
        <div style="position: relative; height: 260px; margin: 20px 0;">
            <canvas id="nChart"></canvas>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <h2 id="balText" style="font-size: 38px; color: var(--accent); line-height: 1;">08:00</h2>
                <p style="font-size: 9px; opacity: 0.4; letter-spacing: 2px;">BO'SH VAQT</p>
            </div>
        </div>
        <div id="aiHub"></div>
    </div>
</div>

<script>
    // Dinamik funksiyalar va Firebase mantiqi bu yerda davom etadi...
    // P1, P2, P3 tanlash funksiyasi optimallashtirildi.
</script>
</body>
</html>

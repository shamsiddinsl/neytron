<!DOCTYPE html>
<html lang="uz">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLEXD4WTZH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BLEXD4WTZH');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neytron | Strategic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(34, 211, 238, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: var(--text); padding: 10px; 
            line-height: 1.4; overflow-x: hidden; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Yuklanish vaqtidagi bo'shliqni oldini olish */
        .chart-container { 
            position: relative; height: 280px; width: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .chart-ready { opacity: 1 !important; }

        #main-app { display: none; max-width: 1200px; margin: auto; padding-bottom: 40px; }

        header { 
            position: sticky; top: 0; z-index: 100; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; border-radius: 20px; 
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        .brand { color: var(--accent); font-size: 16px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .atom-core { animation: spin 4s linear infinite; font-size: 20px; }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        #pDate { 
            background: rgba(34, 211, 238, 0.05); border: 1px solid var(--border); 
            color: var(--accent); border-radius: 10px; padding: 6px; 
            font-size: 13px; font-weight: 800; width: 130px; text-align: center;
            appearance: none; -webkit-appearance: none;
        }

        #user-p { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); background: var(--card); }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 1024px) { .dashboard { grid-template-columns: 420px 1fr; } }

        .panel { background: rgba(15, 23, 42, 0.6); border-radius: 25px; border: 1px solid var(--border); padding: 20px; backdrop-filter: blur(10px); }
        .label-sm { display: block; margin-bottom: 12px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; color: var(--accent); }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .res-item { background: rgba(0,0,0,0.3); border-radius: 18px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .res-item input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 18px; font-weight: 900; }

        .zone-card { position: relative; margin-bottom: 12px; padding: 12px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        .p-indicator { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; cursor: pointer; }
        
        .zone-card input.name { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; font-weight: 600; }
        .zone-card input.time { width: 65px; background: #030712; border: 1px solid var(--border); border-radius: 12px; padding: 8px; text-align: center; color: var(--accent); font-weight: 900; }

        .balans-center { position: absolute; text-align: center; pointer-events: none; }
        .balans-center h1 { font-size: 44px; font-weight: 900; color: var(--accent); line-height: 1; }
        
        .btn-run { width: 100%; margin-top: 15px; padding: 18px; border: none; border-radius: 20px; background: linear-gradient(135deg, #22d3ee, #0891b2); color: #000; font-size: 15px; font-weight: 900; cursor: pointer; }
        .btn-add { width: 100%; margin-top: 5px; padding: 15px; border-radius: 18px; border: 2px dashed rgba(255,255,255,0.1); background: transparent; color: #64748b; font-weight: 700; cursor: pointer; }

        #login-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); }
        
        /* Custom Alert */
        #custom-alert { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(10px); }
        .modal-box { width: 80%; max-width: 300px; background: var(--card); border: 1px solid var(--accent); border-radius: 30px; padding: 30px; text-align: center; }
        
        .p-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: space-around; background: var(--card); border-radius: 20px; z-index: 10; border: 2px solid var(--accent); }
        .ai-card { padding: 15px; border-radius: 18px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border: 1px solid var(--border); border-left-width: 5px; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .error-shake { animation: shake 0.3s ease; border-color: var(--p1) !important; }
    </style>
</head>
<body>

<div id="custom-alert">
    <div class="modal-box">
        <div style="width:50px; height:50px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px; color:#000;"><i class="fa-solid fa-check fa-lg"></i></div>
        <p id="modal-msg" style="font-weight:700;">Tayyor!</p>
        <button class="btn-run" onclick="closeModal()" style="margin-top:20px; padding:12px;">OK</button>
    </div>
</div>

<div id="login-screen">
    <div style="text-align:center;">
        <h1 style="letter-spacing: 5px; color: var(--accent); margin-bottom: 20px;">NEYTRON</h1>
        <button class="btn-run" onclick="window.signIn()" style="width:260px;"><i class="fa-brands fa-google"></i> Google bilan kirish</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div class="brand"><i class="fa-solid fa-atom atom-core"></i> NEYTRON</div>
        <div class="header-right">
            <input type="date" id="pDate" onchange="window.loadData()">
            <div id="user-p"></div>
        </div>
    </header>

    <div class="dashboard">
        <section class="panel">
            <span class="label-sm">Strategik resurslar</span>
            <div class="res-grid">
                <div class="res-item"><label style="font-size:8px; opacity:0.5;">UYQU (SOAT)</label><input type="number" id="sH" value="8" step="0.5" onchange="updateUI()"></div>
                <div class="res-item"><label style="font-size:8px; opacity:0.5;">ISH/O'QISH (SOAT)</label><input type="number" id="wH" value="8" step="0.5" onchange="updateUI()"></div>
            </div>
            <div id="zList"></div>
            <button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>
            <button class="btn-run" onclick="window.saveData()">SAQLASH</button>
        </section>

        <section class="panel">
            <span class="label-sm">Vaqt tahlili</span>
            <div class="chart-container" id="cWrap">
                <canvas id="nChart"></canvas>
                <div class="balans-center">
                    <h1 id="balText">00:00</h1>
                    <p style="font-size: 8px; letter-spacing: 2px; opacity: 0.5;">BO'SH VAQT</p>
                </div>
            </div>
            <div id="aiHub" style="margin-top:20px;"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence);
    
    window.signIn = async () => { try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); } };

    window.saveData = async () => {
        const user = auth.currentUser; if(!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));
        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        window.showAlert("Strategiya muvaffaqiyatli saqlandi!");
    };

    window.loadData = async () => {
        const user = auth.currentUser; if (!user) return;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('sH').value = data.sleep || 8;
            document.getElementById('wH').value = data.work || 8;
            if(data.zones) data.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        }
        updateUI();
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%; height:100%; object-fit:cover;">`;
            window.loadData();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.showAlert = (msg) => {
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('custom-alert').style.display = 'flex';
    };
    window.closeModal = () => document.getElementById('custom-alert').style.display = 'none';

    window.addZ = (n='', m='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card'; div.id = `z-${id}`; div.dataset.p = p;
        const colors = { p1: '#ef4444', p2: '#d97706', p3: '#10b981' };
        
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator" style="color:${colors[p]}; background:${colors[p]}15; border-color:${colors[p]}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" onchange="updateUI()">
                <input type="number" class="time" placeholder="min" value="${m}" onchange="validateTime(${id})">
                <i class="fa-solid fa-trash-can" style="opacity:0.2;" onclick="document.getElementById('z-${id}').remove(); updateUI();"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:#ef4444; font-weight:900;">P1</div>
                <div onclick="selP(${id},'p2')" style="color:#d97706; font-weight:900;">P2</div>
                <div onclick="selP(${id},'p3')" style="color:#10b981; font-weight:900;">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.validateTime = (id) => {
        const card = document.getElementById(`z-${id}`);
        const input = card.querySelector('.time');
        let total = (+document.getElementById('sH').value * 60) + (+document.getElementById('wH').value * 60);
        document.querySelectorAll('.zone-card').forEach(z => {
            if(z.id !== `z-${id}`) total += (+z.querySelector('.time').value || 0);
        });
        if (total + (+input.value) > 1440) {
            input.value = Math.max(0, 1440 - total);
            card.classList.add('error-shake');
            setTimeout(() => card.classList.remove('error-shake'), 400);
        }
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        const colors = { p1: '#ef4444', p2: '#d97706', p3: '#10b981' };
        const ind = z.querySelector('.p-indicator');
        ind.style.color = colors[p]; ind.style.borderColor = colors[p]; ind.style.background = colors[p] + "15";
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };

    window.updateUI = () => {
        let sleep = (+document.getElementById('sH').value || 0) * 60;
        let work = (+document.getElementById('wH').value || 0) * 60;
        let total = sleep + work;
        let labels = ['Uyqu', 'Ish'], vals = [sleep, work], colors = ['#1e293b', '#334155'];
        
        document.querySelectorAll('.zone-card').forEach(z => {
            let v = +z.querySelector('.time').value || 0;
            if (v > 0) { 
                vals.push(v); labels.push(z.querySelector('.name').value || 'Vazifa'); total += v;
                const p = z.dataset.p;
                colors.push(p === 'p1' ? '#ef4444' : p === 'p2' ? '#d97706' : '#10b981');
            }
        });

        const bal = Math.max(0, 1440 - total);
        vals.push(bal); labels.push('Bo\'sh'); colors.push('rgba(34, 211, 238, 0.05)');
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        const ctx = document.getElementById('nChart').getContext('2d');
        if (chart) {
            chart.data.labels = labels; chart.data.datasets[0].data = vals; chart.data.datasets[0].backgroundColor = colors; chart.update('none');
        } else {
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '82%', animation: false, plugins: { legend: { display: false } } }
            });
        }
        document.getElementById('cWrap').classList.add('chart-ready');

        // Analitika
        const hub = document.getElementById('aiHub'); hub.innerHTML = '';
        if (bal > 0) {
            const lost = Math.floor((bal * 365) / 60);
            hub.innerHTML += `<div class="ai-card" style="border-left-color:var(--p1)">
                <h6 style="font-size:9px; color:var(--p1); font-weight:900;">STRATEGIK YO'QOTISH</h6>
                <p style="font-size:12px;">Yillik potentsial yo'qotish: <b>${lost} soat</b> (${Math.floor(lost/24)} kun).</p>
            </div>`;
        }
        document.querySelectorAll('.zone-card').forEach(z => {
            const n = z.querySelector('.name').value;
            if (n) {
                const p = z.dataset.p;
                const c = p==='p1'?'#ef4444':p==='p2'?'#d97706':'#10b981';
                hub.innerHTML += `<div class="ai-card" style="border-left-color:${c}">
                    <p style="font-size:12px; opacity:0.9;">"${n}" — ${p==='p1'?'muhim maqsad':p==='p2'?'rejali ish':'odatiy vazifa'}.</p>
                </div>`;
            }
        });
    };
</script>
</body>
</html>

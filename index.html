<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeytronOS | Time Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --bg: #020617; --card: #0f172a; --accent: #22d3ee; 
            --danger: #ef4444; --text: #f8fafc; --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(34, 211, 238, 0.3);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }

        .app-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) { .app-container { grid-template-columns: 380px 1fr; } }

        /* Branding */
        .header { 
            grid-column: 1 / -1; background: var(--card); padding: 20px 30px; border-radius: 20px; 
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-icon { 
            width: 40px; height: 40px; border: 2px solid var(--accent); border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--glow);
        }
        .brand-text { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
        .brand-text span { color: var(--accent); }

        /* Card System */
        .card { 
            background: var(--card); border-radius: 24px; padding: 25px; 
            border: 1px solid var(--border);
        }
        .section-title { font-size: 14px; font-weight: 700; margin-bottom: 20px; color: var(--accent); display: flex; align-items: center; gap: 10px; text-transform: uppercase; }

        /* Input Controls */
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        input { 
            width: 100%; background: #1e293b; border: 1px solid var(--border); padding: 14px; 
            color: #fff; border-radius: 12px; font-size: 15px; outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }

        /* Zone Builder */
        .zone-row { display: grid; grid-template-columns: 1fr 80px 40px; gap: 10px; margin-bottom: 12px; }
        .btn { cursor: pointer; border: none; font-weight: 700; border-radius: 14px; transition: 0.2s; }
        .btn-add { background: rgba(34, 211, 238, 0.05); color: var(--accent); width: 100%; padding: 12px; border: 1px dashed var(--accent); }
        .btn-save { background: var(--accent); color: #020617; width: 100%; padding: 16px; margin-top: 20px; font-size: 15px; box-shadow: 0 4px 15px var(--glow); }

        /* Professional Insights Center */
        .insight-card { 
            background: rgba(255,255,255,0.02); border-left: 3px solid var(--accent); 
            padding: 20px; border-radius: 0 16px 16px 0; margin-bottom: 15px;
        }
        .insight-card strong { color: var(--accent); display: block; margin-bottom: 8px; font-size: 15px; }
        .insight-card p { font-size: 14px; line-height: 1.6; color: #cbd5e1; }
        .insight-card b { color: #fff; }

        /* Visualization */
        .chart-box { position: relative; height: 320px; display: flex; align-items: center; justify-content: center; }
        .center-display { position: absolute; text-align: center; }
        #balance-text { font-size: 50px; font-weight: 900; color: #fff; line-height: 1; }
        .negative { color: var(--danger) !important; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="logo-box">
            <div class="logo-icon"><i class="fa-solid fa-bolt" style="color: var(--accent);"></i></div>
            <div class="brand-text">NEYTRON<span>OS</span></div>
        </div>
        <input type="date" id="datePicker" style="width: auto; padding: 8px; border-radius: 8px;">
    </header>

    <aside class="card">
        <div class="section-title"><i class="fa-solid fa-clock"></i> Taqsimot</div>
        <div class="input-group">
            <label>Uyqu (Soat)</label>
            <input type="number" id="sleepH" value="8" step="0.5">
        </div>
        <div class="input-group">
            <label>Majburiyatlar (Ish/O'qish)</label>
            <input type="number" id="workH" value="8" step="0.5">
        </div>

        <div class="section-title" style="margin-top: 30px;"><i class="fa-solid fa-layer-group"></i> Foydali Zonalar</div>
        <div id="zones-container"></div>
        <button class="btn btn-add" onclick="addNewZone()"><i class="fa-solid fa-plus-circle"></i> Zona qo'shish</button>
        
        <button class="btn btn-save" onclick="saveData()">
            <i class="fa-solid fa-microchip"></i> TAHLIL VA SAQLASH
        </button>
    </aside>

    <main>
        <section class="card" style="margin-bottom: 20px;">
            <div class="chart-box">
                <canvas id="balanceChart"></canvas>
                <div class="center-display">
                    <div id="balance-text">08:00</div>
                    <p style="font-size: 10px; letter-spacing: 2px; opacity: 0.5;">QOLGAN BALANS</p>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="section-title"><i class="fa-solid fa-brain"></i> Neytron Analitika Markazi</div>
            <div id="insights-output">
                <div class="insight-card"><p>Ma'lumotlarni kiriting va tahlil tugmasini bosing.</p></div>
            </div>
        </section>
    </main>
</div>

<script>
let chart;
const dateEl = document.getElementById('datePicker');
dateEl.valueAsDate = new Date();

function init() {
    loadData();
    dateEl.onchange = loadData;
}

function addNewZone(name = '', min = '') {
    const div = document.createElement('div');
    div.className = 'zone-row';
    div.innerHTML = `
        <input type="text" placeholder="Zona nomi" value="${name}" class="z-n">
        <input type="number" placeholder="Min" value="${min}" class="z-v">
        <button onclick="this.parentElement.remove(); refreshUI()" style="background:none; color:var(--danger); border:none; font-size:18px;"><i class="fa-solid fa-circle-xmark"></i></button>
    `;
    document.getElementById('zones-container').appendChild(div);
    div.querySelectorAll('input').forEach(i => i.oninput = refreshUI);
    refreshUI();
}

function refreshUI() {
    const s = (+document.getElementById('sleepH').value || 0) * 60;
    const w = (+document.getElementById('workH').value || 0) * 60;
    let labels = ['Uyqu', 'Majburiyatlar'], values = [s, w], zTotal = 0;

    document.querySelectorAll('.zone-row').forEach(r => {
        const n = r.querySelector('.z-n').value || 'Zona', v = +r.querySelector('.z-v').value || 0;
        if(v > 0) { labels.push(n); values.push(v); zTotal += v; }
    });

    const total = s + w + zTotal;
    const free = 1440 - total;
    const disp = document.getElementById('balance-text');
    
    disp.innerText = `${Math.floor(Math.abs(free)/60).toString().padStart(2,'0')}:${(Math.abs(free)%60).toString().padStart(2,'0')}`;
    free < 0 ? disp.classList.add('negative') : disp.classList.remove('negative');

    labels.push('Bo\'sh vaqt'); values.push(free > 0 ? free : 0);

    if(chart) chart.destroy();
    chart = new Chart(document.getElementById('balanceChart'), {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: ['#1e293b', '#334155', '#22d3ee', '#3b82f6', '#8b5cf6', '#ec4899', '#10b981'],
                borderWidth: 0, cutout: '82%'
            }]
        },
        options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
    });
}

function saveData() {
    const s = document.getElementById('sleepH').value;
    const w = document.getElementById('workH').value;
    const z = Array.from(document.querySelectorAll('.zone-row')).map(r => ({n: r.querySelector('.z-n').value, v: r.querySelector('.z-v').value}));
    
    localStorage.setItem(`n_v5_${dateEl.value}`, JSON.stringify({s, w, z}));
    runAnalysis(s, w, z);
}

function runAnalysis(s, w, z) {
    const output = document.getElementById('insights-output');
    output.innerHTML = '';
    
    const zTotalMin = z.reduce((a, b) => a + (+b.v || 0), 0);
    const freeMin = 1440 - ((s * 60) + (w * 60) + zTotalMin);
    
    // 1. STRATEGIK INVESTITSIYA (Eng katta zona)
    const topZone = z.sort((a, b) => b.v - a.v)[0];
    if (topZone && topZone.v > 0) {
        const yH = Math.floor((topZone.v * 365) / 60);
        output.appendChild(createInsight(
            `Strategik Investitsiya: ${topZone.n}`,
            `Agar shu tempni saqlasangiz, yiliga <b>${yH} soat</b> vaqtingizni ushbu sohaga yo'naltirasiz. Bu professional darajaga chiqish uchun yiliga qo'shimcha <b>${Math.floor(yH/8)} ta to'liq ish kuni</b> degani.`
        ));
    }

    // 2. VAQT INFLYATSIYASI (Bo'sh vaqt)
    if (freeMin > 0) {
        const yD = Math.floor((freeMin * 365) / 1440);
        output.appendChild(createInsight(
            "Vaqt Inflyatsiyasi",
            `Hozirgi bo'sh vaqtingiz yiliga <b>${yD} sutkani</b> tashkil qiladi. Ushbu vaqtni nazorat qilmaslik — hayotingizdan yiliga <b>${yD} kunni</b> butunlay o'chirib tashlash bilan barobardir.`
        ));
    }

    // 3. KRITIK OGOHLANTIRISH (Uyqu)
    if (s < 7) {
        output.appendChild(createInsight(
            "Kritik Holat: Biologik Limit",
            "Sizning uyqungiz me'yordan kam. Bu miyaning kognitiv quvvatini 30% gacha pasaytiradi. Siz hozir o'z potensialingizning faqat 70% idan foydalanyapsiz.",
            true
        ));
    }
}

function createInsight(title, text, isDanger = false) {
    const d = document.createElement('div');
    d.className = 'insight-card';
    if(isDanger) d.style.borderLeftColor = 'var(--danger)';
    d.innerHTML = `<strong>${title}</strong><p>${text}</p>`;
    return d;
}

function loadData() {
    const saved = JSON.parse(localStorage.getItem(`n_v5_${dateEl.value}`));
    document.getElementById('zones-container').innerHTML = '';
    if(saved) {
        document.getElementById('sleepH').value = saved.s;
        document.getElementById('workH').value = saved.w;
        saved.z.forEach(z => addNewZone(z.n, z.v));
    } else {
        document.getElementById('sleepH').value = 8;
        document.getElementById('workH').value = 8;
        addNewZone('Kitob o\'qish', 45);
    }
    refreshUI();
}

window.onload = init;
</script>
</body>
</html>

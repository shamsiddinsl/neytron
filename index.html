<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neytron | Strategic Core</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 12px; overflow-x: hidden; min-height: 100vh; }

        /* Header */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 12px 18px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px);
        }
        .brand { font-weight: 900; font-size: 16px; letter-spacing: 3px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .atom-core { animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .header-controls { display: flex; align-items: center; gap: 8px; }
        #pDate { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 12px; outline: none; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); overflow: hidden; background: #1e293b; }

        /* Panellar */
        .panel { background: var(--card); border-radius: 24px; padding: 22px; border: 1px solid var(--border); margin-bottom: 20px; }
        .label-sm { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; display: block; opacity: 0.6; }

        /* Zonalarni boshqarish */
        .zone-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .zone-main { display: flex; align-items: center; gap: 12px; }
        .zone-card input { background: transparent; border: none; color: #fff; outline: none; font-weight: 600; }
        .zone-card input.name { flex: 1; font-size: 15px; }
        .zone-card input.time { width: 70px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; font-weight: 800; color: var(--accent) !important; }

        .p-indicator { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); font-weight: 900; font-size: 13px; }
        .p-indicator.p1 { color: var(--p1); border-color: var(--p1); background: rgba(239, 68, 68, 0.1); }
        .p-indicator.p2 { color: var(--p2); border-color: var(--p2); background: rgba(217, 119, 6, 0.1); }
        .p-indicator.p3 { color: var(--p3); border-color: var(--p3); background: rgba(16, 185, 129, 0.1); }

        /* Toast Message (Saqlandi xabari) */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 14px; z-index: 1000; display: none; box-shadow: 0 10px 30px rgba(34, 211, 238, 0.4); }

        /* Analitika */
        .chart-container { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
        .balans-center { position: absolute; text-align: center; pointer-events: none; }
        .balans-center h1 { font-size: 45px; font-weight: 900; color: var(--accent); line-height: 1; }
        .balans-center p { font-size: 9px; opacity: 0.4; letter-spacing: 3px; margin-top: 5px; }

        .ai-card { background: rgba(34, 211, 238, 0.05); border-left: 4px solid var(--accent); padding: 15px; border-radius: 15px; margin-bottom: 15px; font-size: 13px; line-height: 1.5; }
        .ai-card.warning { border-left-color: var(--p1); background: rgba(239, 68, 68, 0.05); color: var(--p1); }

        .btn-run { background: var(--accent); color: #000; width: 100%; padding: 18px; border-radius: 20px; font-weight: 900; border: none; cursor: pointer; margin-top: 15px; letter-spacing: 2px; }
        .btn-add { background: transparent; border: 1px dashed var(--border); color: #64748b; width: 100%; padding: 14px; border-radius: 15px; font-weight: 700; margin: 10px 0; cursor: pointer; }

        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
    </style>
</head>
<body>

<div id="toast">SAQLANDI</div>

<div id="login-screen">
    <div style="text-align: center;">
        <h1 style="font-weight: 900; letter-spacing: 10px; color: var(--accent); margin-bottom: 30px;">NEYTRON</h1>
        <button class="btn-run" style="width: 260px;" onclick="window.signIn()">KIRISH</button>
    </div>
</div>

<div id="main-app" style="display: none;">
    <header>
        <div class="brand"><i class="fa-solid fa-atom atom-core"></i> NEYTRON</div>
        <div class="header-controls">
            <input type="date" id="pDate" onchange="window.loadData()">
            <div class="user-avatar" id="user-p"></div>
        </div>
    </header>

    <div class="panel">
        <span class="label-sm">Asosiy Resurslar</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 5px;">UYQU (SOAT)</label>
                <input type="number" id="sH" value="8" oninput="updateUI()" style="background:transparent; border:none; color:#fff; text-align:center; font-weight:800; font-size:20px; width:100%; outline:none;">
            </div>
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 5px;">ISH (SOAT)</label>
                <input type="number" id="wH" value="8" oninput="updateUI()" style="background:transparent; border:none; color:#fff; text-align:center; font-weight:800; font-size:20px; width:100%; outline:none;">
            </div>
        </div>
    </div>

    <div class="panel">
        <span class="label-sm">Vaqt Zonalari (Daqiqa)</span>
        <div id="zList"></div>
        <button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>
        <button class="btn-run" onclick="window.saveData()">STRATEGIK SAQLASH</button>
    </div>

    <div class="panel">
        <span class="label-sm">Universal Analitika</span>
        <div id="aiHub"></div>
        <div class="chart-container">
            <canvas id="nChart"></canvas>
            <div class="balans-center">
                <h1 id="balText">08:00</h1>
                <p>BO'SH VAQT</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    enableIndexedDbPersistence(db).catch(() => {});

    setPersistence(auth, browserLocalPersistence).then(() => {
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%; height:100%">`;
                window.loadData();
            }
        });
    });

    window.signIn = () => signInWithPopup(auth, provider);

    window.saveData = async () => {
        if(window.navigator.vibrate) window.navigator.vibrate(20);
        const user = auth.currentUser;
        if (!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));

        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    };

    window.loadData = async () => {
        const user = auth.currentUser;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('sH').value = data.sleep;
            document.getElementById('wH').value = data.work;
            if(data.zones) data.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        } else { window.addZ('', '', 'p2'); }
        updateUI();
    };
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.addZ = (n='', t='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card';
        div.id = `z-${id}`;
        div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})">${p.toUpperCase()}</div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" oninput="updateUI()">
                <input type="number" placeholder="min" class="time" value="${t}" oninput="updateUI()">
                <i class="fa-solid fa-xmark" style="opacity:0.3" onclick="remZ(${id})"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:var(--p1)">P1</div>
                <div onclick="selP(${id},'p2')" style="color:var(--p2)">P2</div>
                <div onclick="selP(${id},'p3')" style="color:var(--p3)">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        z.querySelector('.p-indicator').innerText = p.toUpperCase();
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };
    window.remZ = (id) => { document.getElementById(`z-${id}`).remove(); updateUI(); };

    window.updateUI = () => {
        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;
        let zSum = 0, colors = ['#1e293b', '#334155'], vals = [s, w], labs = ['Uyqu', 'Ish'];

        document.querySelectorAll('.zone-card').forEach(z => {
            const t = +z.querySelector('.time').value || 0;
            const p = z.dataset.p;
            zSum += t;
            vals.push(t);
            labs.push(z.querySelector('.name').value || 'Vazifa');
            colors.push(p === 'p1' ? '#ef4444' : p === 'p2' ? '#d97706' : '#10b981');
        });

        const bal = Math.max(0, 1440 - (s + w + zSum));
        vals.push(bal); labs.push('Bo\'sh'); colors.push('#22d3ee');
        
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        const ctx = document.getElementById('nChart').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labs, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
            options: { cutout: '85%', plugins: { legend: { display: false } }, animation: { duration: 0 } }
        });
        
        analyze(bal, zSum);
    };

    function analyze(bal, totalZones) {
        const hub = document.getElementById('aiHub');
        hub.innerHTML = '';
        if (bal > 0) {
            const loss = Math.floor((bal * 365) / 60);
            hub.innerHTML += `<div class="ai-card warning"><b>DIQQAT:</b> Bir yilda <b>${loss} soat</b> vaqtingizni boy berishingiz mumkin!</div>`;
        }
        if (totalZones > 0) {
            hub.innerHTML += `<div class="ai-card">Fokuslangan vaqtingiz jami kunning ${(totalZones/14.4).toFixed(1)}% qismini tashkil qiladi.</div>`;
        }
    }
</script>
</body>
</html>

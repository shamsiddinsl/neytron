<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron | Strategic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 12px; overflow-x: hidden; }

        /* Header */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 10px 15px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 20px; position: sticky; top: 0; z-index: 100;
        }
        .brand { font-weight: 900; font-size: 16px; letter-spacing: 3px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .atom-core { animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .header-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        #pDate { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 6px 8px; border-radius: 12px; font-weight: 800; font-size: 12px; outline: none; width: 125px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); overflow: hidden; background: #1e293b; }

        /* Panellar */
        .panel { background: var(--card); border-radius: 24px; padding: 22px; border: 1px solid var(--border); margin-bottom: 20px; }
        .label-sm { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; display: block; opacity: 0.6; }

        /* Zona va P1/P2/P3 */
        .zone-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .zone-main { display: flex; align-items: center; gap: 12px; }
        .p-indicator { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); font-weight: 900; font-size: 14px; }
        .p-indicator.p1 { color: var(--p1); border-color: var(--p1); background: rgba(239, 68, 68, 0.1); }
        .p-indicator.p2 { color: var(--p2); border-color: var(--p2); background: rgba(217, 119, 6, 0.1); }
        .p-indicator.p3 { color: var(--p3); border-color: var(--p3); background: rgba(16, 185, 129, 0.1); }

        .zone-card input.name { background: transparent; border: none; color: #fff; outline: none; font-size: 15px; font-weight: 600; flex: 1; min-width: 50px; }
        .zone-card input.time { width: 70px; background: #030712; border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; font-weight: 800; color: var(--accent); outline: none; }

        .p-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card); border-radius: 20px; align-items: center; justify-content: space-around; z-index: 10; border: 1px solid var(--accent); }

        /* Analitika va Bo'sh Vaqt */
        .chart-container { position: relative; height: 300px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        .balans-center { position: absolute; text-align: center; pointer-events: none; }
        .balans-center h1 { font-size: 45px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -1px; }
        .balans-center p { font-size: 9px; opacity: 0.4; letter-spacing: 3px; margin-top: 5px; }

        .loss-warning { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--p1); color: var(--p1); padding: 15px; border-radius: 18px; margin-bottom: 15px; font-size: 13px; font-weight: 700; line-height: 1.4; }
        .ai-card { background: rgba(255,255,255,0.03); border-radius: 18px; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; border-left: 5px solid var(--accent); }

        .btn-run { background: var(--accent); color: #000; width: 100%; padding: 18px; border-radius: 20px; font-weight: 900; border: none; cursor: pointer; margin-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="main-app" style="display: block; max-width: 500px; margin: 0 auto;">
    <header>
        <div class="brand"><i class="fa-solid fa-atom atom-core"></i> NEYTRON</div>
        <div class="header-controls">
            <input type="date" id="pDate" onchange="window.loadData()">
            <div class="user-avatar" id="user-p"></div>
            <i class="fa-solid fa-power-off" style="opacity: 0.3; cursor: pointer;" onclick="window.logout()"></i>
        </div>
    </header>

    <div class="panel">
        <span class="label-sm">Asosiy Resurslar (Soat)</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 4px;">UYQU</label>
                <input type="number" id="sH" value="8" oninput="updateUI()" style="background:transparent; border:none; color:#fff; text-align:center; font-weight:800; font-size:18px; width:100%; outline:none;">
            </div>
            <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; text-align: center;">
                <label style="font-size: 9px; opacity: 0.5; display: block; margin-bottom: 4px;">ISH</label>
                <input type="number" id="wH" value="8" oninput="updateUI()" style="background:transparent; border:none; color:#fff; text-align:center; font-weight:800; font-size:18px; width:100%; outline:none;">
            </div>
        </div>
    </div>

    <div class="panel">
        <span class="label-sm">Vaqt Zonalari (Daqiqa)</span>
        <div id="zList"></div>
        <button onclick="addZ()" style="background: transparent; border: 1px dashed var(--border); color: #64748b; width: 100%; padding: 14px; border-radius: 15px; font-weight: 700; margin: 10px 0;">+ YANGI ZONA</button>
        <button class="btn-run" onclick="window.saveData()">STRATEGIK SAQLASH</button>
    </div>

    <div class="panel">
        <span class="label-sm">Balans va Yillik Tahlil</span>
        <div class="chart-container">
            <canvas id="nChart"></canvas>
            <div class="balans-center">
                <h1 id="balText">08:00</h1>
                <p>BO'SH VAQT</p>
            </div>
        </div>
        <div id="aiHub"></div>
    </div>
</div>

<script>
    // Dinamik funksiyalarni qayta tiklaymiz
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.addZ = (n='', t='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card';
        div.id = `z-${id}`;
        div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})">${p.toUpperCase()}</div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" oninput="updateUI()">
                <input type="number" placeholder="min" class="time" value="${t}" oninput="updateUI()">
                <i class="fa-solid fa-xmark" style="opacity:0.2" onclick="remZ(${id})"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:var(--p1); font-weight:900;">P1</div>
                <div onclick="selP(${id},'p2')" style="color:var(--p2); font-weight:900;">P2</div>
                <div onclick="selP(${id},'p3')" style="color:var(--p3); font-weight:900;">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        z.querySelector('.p-indicator').innerText = p.toUpperCase();
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };
    window.remZ = (id) => { document.getElementById(`z-${id}`).remove(); updateUI(); };

    window.updateUI = () => {
        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;
        let zSum = 0;
        document.querySelectorAll('.zone-card').forEach(z => zSum += (+z.querySelector('.time').value || 0));
        
        const balMin = Math.max(0, 1440 - (s + w + zSum));
        document.getElementById('balText').innerText = `${Math.floor(balMin/60).toString().padStart(2,'0')}:${(balMin%60).toString().padStart(2,'0')}`;

        if (!chart) {
            chart = new Chart(document.getElementById('nChart'), {
                type: 'doughnut',
                data: { datasets: [{ data: [s, w, zSum, balMin], backgroundColor: ['#1e293b', '#334155', '#ef4444', '#22d3ee'], borderWidth: 0 }] },
                options: { cutout: '85%', plugins: { legend: { display: false } } }
            });
        } else {
            chart.data.datasets[0].data = [s, w, zSum, balMin];
            chart.update();
        }
        window.analyze(balMin);
    };

    window.analyze = (balMin) => {
        const hub = document.getElementById('aiHub');
        hub.innerHTML = '';
        if (balMin > 0) {
            const loss = Math.floor((balMin * 365) / 60);
            hub.innerHTML += `<div class="loss-warning">DIQQAT: Ushbu bo'sh vaqt bilan bir yilda ${loss} soatni boy berishingiz mumkin!</div>`;
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neytron | AI Upgrade</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
:root{
--bg:#030712;
--card:#0f172a;
--accent:#22d3ee;
--text:#f1f5f9;
--border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
padding:12px;
overflow-x:hidden;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020617;
z-index:999;
}

.box{
background:var(--card);
padding:30px;
border-radius:16px;
text-align:center;
width:90%;
max-width:360px;
}

button{
padding:12px 16px;
border:none;
border-radius:10px;
background:var(--accent);
font-weight:800;
cursor:pointer;
}

/* APP */
#app{
display:none;
max-width:1000px;
margin:auto;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

/* PANEL */
.panel{
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
background:#020617;
color:#fff;
}

/* TASK */
.task{
display:flex;
justify-content:space-between;
padding:8px;
margin-top:6px;
background:#020617;
border-radius:8px;
}

/* CHART */
canvas{max-width:100%;}

/* MOBILE FIX */
@media(max-width:600px){
header{flex-direction:column;align-items:flex-start;gap:8px;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h2>Neytron AI</h2>
<p>Bir marta login</p>
<br>
<button onclick="login()">Google Login</button>
</div>
</div>

<!-- APP -->
<div id="app">

<header>
<div><b>NEYTRON AI</b></div>
<button onclick="logout()">Chiqish</button>
</header>

<div class="panel">
<h3>Vazifa qo‘shish</h3>

<input id="name" placeholder="Vazifa">
<input id="time" type="number" placeholder="Vaqt (min)">

<button onclick="add()">Qo‘shish</button>

<div id="list"></div>
</div>

<div class="panel">
<h3>AI Analitika</h3>
<canvas id="chart"></canvas>
<div id="ai"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
authDomain: "neytronplanner.firebaseapp.com",
projectId: "neytronplanner",
storageBucket: "neytronplanner.firebasestorage.app",
messagingSenderId: "960758855592",
appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ⭐ LOGIN FIX (1 marta kirish) */
setPersistence(auth, browserLocalPersistence);

window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}else{
document.getElementById("login").style.display="flex";
document.getElementById("app").style.display="none";
}
});

</script>

<script>

let tasks=[];
let chart;

/* ADD */
window.add=()=>{

const n=document.getElementById("name").value;
const t=document.getElementById("time").value;

if(!n||!t) return;

tasks.push({n,t});

render();
ai();
};

/* RENDER */
function render(){

document.getElementById("list").innerHTML=
tasks.map(t=>
`<div class="task">
<span>${t.n}</span>
<span>${t.t} min</span>
</div>`
).join("");

chartUpdate();
}

/* CHART */
function chartUpdate(){

const ctx=document.getElementById("chart");

if(!chart){
chart=new Chart(ctx,{
type:"doughnut",
data:{
labels:tasks.map(t=>t.n),
datasets:[{data:tasks.map(t=>t.t)}]
},
options:{
responsive:true
}
});
}else{
chart.data.labels=tasks.map(t=>t.n);
chart.data.datasets[0].data=tasks.map(t=>t.t);
chart.update();
}

}

/* AI ENGINE (SIMPLE SMART LOGIC) */
function ai(){

let box=document.getElementById("ai");
box.innerHTML="";

tasks.forEach(t=>{

if(t.n.toLowerCase().includes("kitob")){
box.innerHTML+=`
<p>📚 Kitob: ${Math.floor(t.t/10)} sahifa o‘qish mumkin</p>`;
}

if(t.n.toLowerCase().includes("sport")){
box.innerHTML+=`
<p>💪 Sport: ${t.t} min juda yaxshi progress</p>`;
}

});

}

</script>

</body>
</html>

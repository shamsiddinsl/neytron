<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron | Strategic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(34, 211, 238, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 12px; line-height: 1.4; overflow-x: hidden; min-height: 100vh; }
        
        #login-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); }
        .login-box { width: 90%; max-width: 400px; padding: 45px 30px; border-radius: 35px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); backdrop-filter: blur(20px); text-align: center; }

        #main-app { display: none; max-width: 1200px; margin: auto; padding-bottom: 50px; }

        /* Mobil Header */
        header { position: sticky; top: 0; z-index: 100; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-radius: 22px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); backdrop-filter: blur(15px); }
        .brand { color: var(--accent); font-size: 18px; font-weight: 900; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .dashboard { grid-template-columns: 420px 1fr; } }

        .panel { background: rgba(15, 23, 42, 0.7); border-radius: 30px; border: 1px solid var(--border); padding: 25px; backdrop-filter: blur(10px); }
        .label-sm { display: block; margin-bottom: 15px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: var(--accent); opacity: 0.7; }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .res-item { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .res-item input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 20px; font-weight: 900; }

        /* Zone Card Mobile Fix */
        .zone-card { position: relative; margin-bottom: 15px; padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        .p-indicator { width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); cursor: pointer; }
        
        .zone-card input.name { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; font-weight: 600; }
        .zone-card input.time { width: 70px; background: #030712; border: 1px solid var(--border); border-radius: 14px; padding: 10px; text-align: center; color: var(--accent); font-weight: 900; outline: none; }

        .chart-container { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .balans-center { position: absolute; text-align: center; }
        .balans-center h1 { font-size: 48px; font-weight: 900; color: var(--accent); line-height: 0.8; }
        
        #chart-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; font-size: 11px; }

        .ai-card { padding: 20px; border-radius: 24px; border-left: 6px solid var(--accent); background: rgba(255,255,255,0.03); margin-bottom: 15px; border: 1px solid var(--border); border-left-width: 6px; }

        .btn-run { width: 100%; margin-top: 20px; padding: 20px; border: none; border-radius: 22px; background: linear-gradient(135deg, #22d3ee, #0891b2); color: #000; font-size: 16px; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
        .btn-add { width: 100%; margin-top: 10px; padding: 18px; border-radius: 20px; border: 2px dashed rgba(255,255,255,0.1); background: transparent; color: #64748b; font-weight: 700; cursor: pointer; }
        
        .p-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: space-around; background: var(--card); border-radius: 22px; z-index: 10; border: 2px solid var(--accent); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>NEYTRON</h1>
        <p style="font-size: 11px; opacity: 0.5; margin-bottom: 35px; letter-spacing: 1px;">STRATEGIC RESOURCE MANAGEMENT</p>
        <button class="btn-run" onclick="window.signIn()" style="margin-top:0"><i class="fa-brands fa-google"></i> Google bilan boshlash</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div class="brand">NEYTRON</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="date" id="pDate" onchange="window.loadData()" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--accent); border-radius:12px; padding:8px; font-weight:800; font-size: 12px; outline:none;">
            <div id="user-p" style="width:38px; height:38px; border-radius:50%; overflow:hidden; border:2px solid var(--accent);"></div>
        </div>
    </header>

    <div class="dashboard">
        <section class="panel">
            <span class="label-sm">Asosiy resurslar</span>
            <div class="res-grid">
                <div class="res-item"><label style="font-size: 9px; opacity: 0.5;">UYQU</label><input type="number" id="sH" value="8" step="0.5" oninput="updateUI()"></div>
                <div class="res-item"><label style="font-size: 9px; opacity: 0.5;">ISH</label><input type="number" id="wH" value="8" step="0.5" oninput="updateUI()"></div>
            </div>
            <div id="zList"></div>
            <button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>
            <button class="btn-run" onclick="window.saveData()">STRATEGIK SAQLASH</button>
        </section>

        <section class="panel">
            <span class="label-sm">Vaqt balansi analitikasi</span>
            <div class="chart-container">
                <canvas id="nChart"></canvas>
                <div class="balans-center">
                    <h1 id="balText">08:00</h1>
                    <p style="font-size: 10px; letter-spacing: 4px; opacity: 0.5;">BO'SH VAQT</p>
                </div>
            </div>
            <div id="chart-legend"></div>
            <div id="aiHub"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence);
    window.signIn = () => signInWithRedirect(auth, provider);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%; height:100%; object-fit:cover;">`;
            window.loadData();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.saveData = async () => {
        const user = auth.currentUser; if(!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));
        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        alert("Saqlandi!");
    };

    window.loadData = async () => {
        const user = auth.currentUser; if (!user) return;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('sH').value = data.sleep;
            document.getElementById('wH').value = data.work;
            if(data.zones) data.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        } else {
            // BU YERDAN AVTOMATIK QO'SHISH OLIB TASHLANDI
            updateUI(); 
        }
    };
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.addZ = (n='', m='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card'; div.id = `z-${id}`; div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" oninput="updateUI()">
                <input type="number" class="time" placeholder="min" value="${m}" oninput="updateUI()">
                <i class="fa-solid fa-trash-can" style="opacity:0.2; cursor:pointer;" onclick="document.getElementById('z-${id}').remove(); updateUI();"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:var(--p1); font-weight:900;">P1</div>
                <div onclick="selP(${id},'p2')" style="color:var(--p2); font-weight:900;">P2</div>
                <div onclick="selP(${id},'p3')" style="color:var(--p3); font-weight:900;">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };

    window.updateUI = () => {
        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;
        let labels = ['Uyqu', 'Ish'], vals = [s, w], colors = ['#1e293b', '#334155'], total = s + w;

        document.querySelectorAll('.zone-card').forEach(z => {
            const v = +z.querySelector('.time').value || 0;
            const n = z.querySelector('.name').value || 'Vazifa';
            if (v > 0) {
                vals.push(v); labels.push(n); total += v;
                const p = z.dataset.p;
                colors.push(p === 'p1' ? '#ef4444' : p === 'p2' ? '#d97706' : '#10b981');
            }
        });

        const bal = Math.max(0, 1440 - total);
        vals.push(bal); labels.push('Bo\'sh vaqt'); colors.push('rgba(34, 211, 238, 0.1)');
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('nChart').getContext('2d'), {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
            options: { cutout: '85%', plugins: { legend: { display: false } } }
        });

        const leg = document.getElementById('chart-legend');
        leg.innerHTML = labels.map((l, i) => `<div class="legend-item" style="display:flex; align-items:center; gap:5px;"><span style="width:8px; height:8px; border-radius:50%; background:${colors[i]}"></span>${l}</div>`).join('');
    };
</script>
</body>
</html>

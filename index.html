<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-title">NEYTRON</div>
        <div class="login-sub">Strategik rejalashtirish platformasi</div>

        <button class="google-btn" onclick="window.signIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Google orqali kirish
        </button>
    </div>
</div>

<div id="main-app">

    <header>
        <div class="brand">
            <i class="fa-solid fa-atom atom-core"></i>
            NEYTRON
        </div>

        <div class="header-controls">
            <input type="date" id="pDate" onchange="window.loadData()">

            <div class="user-avatar" id="user-p"></div>

            <i class="fa-solid fa-right-from-bracket"
               style="opacity:.4; cursor:pointer; font-size:18px"
               onclick="window.logout()"></i>
        </div>
    </header>

    <div class="dashboard">

        <section class="panel">

            <span class="label-sm">Aqliy yuklama darajasi</span>

            <div class="mode-selector">
                <button class="mode-btn" id="m1.5" onclick="setMode(1.5,this)">
                    OSON
                </button>

                <button class="mode-btn active" id="m3.0" onclick="setMode(3.0,this)">
                    O'RTACHA
                </button>

                <button class="mode-btn" id="m5.0" onclick="setMode(5.0,this)">
                    QIYIN
                </button>
            </div>

            <span class="label-sm">Asosiy resurslar</span>

            <div class="res-grid">
                <div class="res-item">
                    <label>UYQU (SOAT)</label>
                    <input type="number" id="sH" value="8" step="0.5" oninput="updateUI()">
                </div>

                <div class="res-item">
                    <label>ISH/O'QISH (SOAT)</label>
                    <input type="number" id="wH" value="8" step="0.5" oninput="updateUI()">
                </div>
            </div>

            <span class="label-sm">Vaqt zonalari</span>

            <div id="zList"></div>

            <button class="btn-add" onclick="addZ()">
                + YANGI ZONA
            </button>

            <button class="btn-run" onclick="saveData()">
                STRATEGIK SAQLASH
            </button>

        </section>

        <section class="panel">

            <span class="label-sm">Vaqt balansi analitikasi</span>

            <div class="chart-container">
                <canvas id="nChart"></canvas>

                <div class="balans-center">
                    <h1 id="balText">08:00</h1>
                    <p>BO'SH VAQT</p>
                </div>
            </div>

            <div id="aiHub"></div>

        </section>

    </div>

</div>

<script>

    let chart;
    let complexity = 3.0;

    document.getElementById('pDate').valueAsDate = new Date();

    window.signIn = () => {
        alert('Firebase ulansa Google Login ishlaydi');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
    }

    window.logout = () => {
        location.reload();
    }

    function setMode(val, btn) {
        complexity = val;

        document.querySelectorAll('.mode-btn').forEach(b => {
            b.classList.remove('active');
        });

        btn.classList.add('active');
    }

    function addZ(n='',m='',p='p2') {

        const id = Date.now() + Math.random();

        const div = document.createElement('div');

        div.className = 'zone-card';
        div.id = `z-${id}`;
        div.dataset.p = p;

        div.innerHTML = `
            <div class="zone-main">

                <div class="p-indicator ${p}" onclick="showP(${id})">
                    <i class="fa-solid fa-flag"></i>
                </div>

                <input
                    type="text"
                    class="name"
                    placeholder="Maqsad..."
                    value="${n}"
                    oninput="updateUI()"
                >

                <input
                    type="number"
                    class="time"
                    placeholder="min"
                    value="${m}"
                    oninput="updateUI()"
                >

                <i class="fa-solid fa-trash-can trash-btn"
                   onclick="remZ(${id})"></i>

            </div>

            <div class="p-overlay" id="ov-${id}">
                <div class="p-opt" style="color:var(--p1)"
                     onclick="selP(${id},'p1')">P1</div>

                <div class="p-opt" style="color:var(--p2)"
                     onclick="selP(${id},'p2')">P2</div>

                <div class="p-opt" style="color:var(--p3)"
                     onclick="selP(${id},'p3')">P3</div>
            </div>
        `;

        document.getElementById('zList').appendChild(div);

        updateUI();
    }

    function showP(id) {
        document.getElementById(`ov-${id}`).style.display = 'flex';
    }

    function selP(id,p) {

        const z = document.getElementById(`z-${id}`);

        z.dataset.p = p;

        z.querySelector('.p-indicator').className = `p-indicator ${p}`;

        document.getElementById(`ov-${id}`).style.display = 'none';

        updateUI();
    }

    function remZ(id) {
        document.getElementById(`z-${id}`).remove();
        updateUI();
    }

    function updateUI() {

        const s = (+document.getElementById('sH').value || 0) * 60;
        const w = (+document.getElementById('wH').value || 0) * 60;

        let labs = ['Uyqu','Ish'];
        let vals = [s,w];
        let total = s + w;

        document.querySelectorAll('.zone-card').forEach(z => {

            const v = +z.querySelector('.time').value || 0;

            vals.push(v);
            labs.push(z.querySelector('.name').value || 'Vazifa');

            total += v;
        });

        const bal = Math.max(0,1440-total);

        vals.push(bal);
        labs.push('Bo\'sh');

        document.getElementById('balText').innerText =
            `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        if(!chart) {

            chart = new Chart(document.getElementById('nChart'), {
                type: 'doughnut',

                data: {
                    labels: labs,
                    datasets: [{
                        data: vals,
                        borderWidth: 0,
                        backgroundColor: [
                            '#1e293b',
                            '#334155',
                            '#ef4444',
                            '#d97706',
                            '#10b981',
                            '#22d3ee',
                            '#8b5cf6'
                        ]
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '82%',
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

        } else {
            chart.data.labels = labs;
            chart.data.datasets[0].data = vals;
            chart.update();
        }

        analyze();
    }

    function analyze() {

        const hub = document.getElementById('aiHub');

        hub.innerHTML = '';

        document.querySelectorAll('.zone-card').forEach(z => {

            const n = z.querySelector('.name').value.toLowerCase();
            const t = +z.querySelector('.time').value;

            if((n.includes('kitob') || n.includes('mutolaa')) && t > 0) {

                hub.innerHTML += `
                    <div class="ai-card">
                        <h6>Mutolaa Strategiyasi</h6>
                        <p>
                            Bugun ${Math.floor(t / complexity)} bet o'qish mumkin.
                        </p>
                    </div>
                `;

            } else if((n.includes('sport') || n.includes('mashq')) && t > 0) {

                hub.innerHTML += `
                    <div class="ai-card sport">
                        <h6>Jismoniy Faollik</h6>
                        <p>
                            ${t} daqiqa sport miyani to'yintiradi.
                        </p>
                    </div>
                `;

            } else if(z.dataset.p === 'p1' && t > 0) {

                hub.innerHTML += `
                    <div class="ai-card crit">
                        <h6>Kritik Fokus</h6>
                        <p>
                            Irodangizni shu vazifaga yo'naltiring.
                        </p>
                    </div>
                `;
            }
        });
    }

    addZ('', '', 'p2');

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neytron</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
:root{
--bg:#050816;
--card:#0f172a;
--accent:#22d3ee;
--text:#e2e8f0;
--border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
padding:10px;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020617;
}

.login-box{
background:var(--card);
padding:25px;
border-radius:15px;
text-align:center;
width:90%;
max-width:350px;
}

button{
background:var(--accent);
border:none;
padding:12px;
border-radius:10px;
font-weight:800;
cursor:pointer;
width:100%;
}

/* APP */
#app{
display:none;
max-width:1000px;
margin:auto;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:var(--card);
border-radius:12px;
margin-bottom:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

@media(min-width:900px){
.grid{grid-template-columns:1fr 1fr;}
}

/* PANEL */
.panel{
background:var(--card);
padding:12px;
border-radius:12px;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
background:#020617;
color:#fff;
}

/* TASK */
.task{
display:flex;
justify-content:space-between;
background:#020617;
padding:8px;
border-radius:8px;
margin-top:6px;
}

/* CHART */
canvas{width:100%!important;height:250px!important;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>Neytron</h2>
<p>Strategik planner</p>
<br>
<button onclick="login()">Google orqali kirish</button>
</div>
</div>

<!-- APP -->
<div id="app">

<header>
<b>NEYTRON</b>
<button onclick="logout()">Chiqish</button>
</header>

<div class="grid">

<!-- LEFT -->
<div class="panel">
<h3>Vazifa qo‘shish</h3>

<input id="name" placeholder="Vazifa">
<input id="time" type="number" placeholder="Vaqt (min)">

<button onclick="addTask()">Qo‘shish</button>

<div id="list"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>Analitika</h3>
<canvas id="chart"></canvas>
<div id="ai"></div>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
authDomain: "neytronplanner.firebaseapp.com",
projectId: "neytronplanner",
storageBucket: "neytronplanner.firebasestorage.app",
messagingSenderId: "960758855592",
appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ⭐ FIX: 1 marta login */
setPersistence(auth, browserLocalPersistence);

window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}else{
document.getElementById("login").style.display="flex";
document.getElementById("app").style.display="none";
}
});

</script>

<script>

let tasks=[];
let chart;

/* ADD TASK */
window.addTask=()=>{

let n=document.getElementById("name").value;
let t=document.getElementById("time").value;

if(!n||!t) return;

tasks.push({n,t});

render();
ai();
};

/* RENDER */
function render(){

document.getElementById("list").innerHTML=
tasks.map(t=>
`<div class="task">
<span>${t.n}</span>
<span>${t.t}m</span>
</div>`
).join("");

updateChart();
}

/* CHART */
function updateChart(){

let ctx=document.getElementById("chart");

if(!chart){
chart=new Chart(ctx,{
type:"doughnut",
data:{
labels:tasks.map(t=>t.n),
datasets:[{
data:tasks.map(t=>t.t)
}]
},
options:{
responsive:true
}
});
}else{
chart.data.labels=tasks.map(t=>t.n);
chart.data.datasets[0].data=tasks.map(t=>t.t);
chart.update();
}

}

/* SIMPLE AI */
function ai(){

let box=document.getElementById("ai");
box.innerHTML="";

tasks.forEach(t=>{

if(t.n.toLowerCase().includes("kitob")){
box.innerHTML+=`<p>📚 ${Math.floor(t.t/10)} sahifa o‘qish mumkin</p>`;
}

if(t.n.toLowerCase().includes("sport")){
box.innerHTML+=`<p>💪 ${t.t} min sport yaxshi</p>`;
}

});

}

</script>

</body>
</html>

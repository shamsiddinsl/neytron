<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeytronOS | Time Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #050810; --card: #0f172a; --accent: #00f2ff; --danger: #ff0055; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        .app-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .app-container { grid-template-columns: 350px 1fr; } }
        
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .header-panel { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
        
        input, select { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 12px; color: #fff; border-radius: 12px; margin: 8px 0; outline: none; }
        input:focus { border-color: var(--accent); }
        
        .zone-row { display: grid; grid-template-columns: 2fr 1fr 40px; gap: 8px; margin-bottom: 8px; }
        .btn { cursor: pointer; border: none; font-weight: bold; transition: 0.3s; border-radius: 12px; padding: 12px; }
        .btn-add { background: rgba(0, 242, 255, 0.1); color: var(--accent); width: 100%; }
        .btn-save { background: var(--accent); color: #000; width: 100%; margin-top: 15px; font-size: 16px; }
        
        .limit-alert { color: var(--danger); font-size: 12px; font-weight: bold; display: none; margin-top: 10px; }
        #chart-wrapper { position: relative; height: 300px; }
        .chart-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="card header-panel">
        <div style="font-weight: 900; letter-spacing: 2px; color: var(--accent);">NEYTRON OS</div>
        <input type="date" id="datePicker" style="width: auto; margin: 0;">
    </header>

    <aside class="card">
        <h3><i class="fa-solid fa-sliders"></i> Taqsimot</h3>
        <label>Uyqu (soat)</label>
        <input type="number" id="sleepH" value="8" min="0" max="24">
        
        <label>Ish/O'qish (soat)</label>
        <input type="number" id="workH" value="8" min="0" max="24">

        <div id="zones-list" style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Foydali zonalar</label>
                <button class="btn btn-add" onclick="addZoneRow()" style="width: 40px; padding: 5px;">+</button>
            </div>
        </div>

        <div id="limitLabel" class="limit-alert"><i class="fa-solid fa-triangle-exclamation"></i> VAQT LIMITI OSHIB KETDI (MAX 24S)</div>
        <button class="btn btn-save" onclick="saveData()">SAQLASH VA TAHLIL</button>
    </aside>

    <main class="card" style="display: flex; flex-direction: column; gap: 20px;">
        <div id="chart-wrapper">
            <canvas id="mainChart"></canvas>
            <div class="chart-info">
                <h2 id="freeTimeDisplay" style="margin:0; font-size: 40px;">08:00</h2>
                <small style="opacity: 0.5;">BO'SH VAQT</small>
            </div>
        </div>
        <div id="summaryText" style="text-align: center; line-height: 1.6;"></div>
    </main>
</div>

<script>
let myChart;
const datePicker = document.getElementById('datePicker');
// Bugungi sanani avtomatik qo'yish
datePicker.valueAsDate = new Date();

function init() {
    loadSelectedDateData();
    datePicker.addEventListener('change', loadSelectedDateData);
}

function addZoneRow(name = '', min = '') {
    const container = document.getElementById('zones-list');
    const div = document.createElement('div');
    div.className = 'zone-row';
    div.innerHTML = `
        <input type="text" placeholder="Nom" value="${name}" class="z-name">
        <input type="number" placeholder="Min" value="${min}" class="z-min">
        <button onclick="this.parentElement.remove(); updateVisuals()" style="background:none; color:var(--danger); border:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
    `;
    container.appendChild(div);
    div.querySelectorAll('input').forEach(i => i.addEventListener('input', updateVisuals));
}

function updateVisuals() {
    const sH = (+document.getElementById('sleepH').value || 0) * 60;
    const wH = (+document.getElementById('workH').value || 0) * 60;
    let labels = ['Uyqu', 'Ish/O\'qish'];
    let values = [sH, wH];
    let zonesTotal = 0;

    document.querySelectorAll('.zone-row').forEach(row => {
        const n = row.querySelector('.z-name').value || 'Zona';
        const v = +row.querySelector('.z-min').value || 0;
        if(v > 0) { labels.push(n); values.push(v); zonesTotal += v; }
    });

    const totalUsed = sH + wH + zonesTotal;
    const freeMin = 1440 - totalUsed;
    
    // Limit tekshiruvi
    const limitLabel = document.getElementById('limitLabel');
    if(totalUsed > 1440) {
        limitLabel.style.display = 'block';
        document.getElementById('freeTimeDisplay').style.color = 'var(--danger)';
    } else {
        limitLabel.style.display = 'none';
        document.getElementById('freeTimeDisplay').style.color = 'var(--accent)';
    }

    // Chartni yangilash
    labels.push('Bo\'sh vaqt');
    values.push(freeMin > 0 ? freeMin : 0);

    const h = Math.floor(Math.abs(freeMin) / 60);
    const m = Math.abs(freeMin) % 60;
    document.getElementById('freeTimeDisplay').innerText = `${freeMin < 0 ? '-' : ''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

    if(myChart) myChart.destroy();
    const ctx = document.getElementById('mainChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: ['#1e293b', '#334155', '#00f2ff', '#ff0055', '#ffaa00', '#00ff88'],
                borderWidth: 0, cutout: '85%', borderRadius: 10
            }]
        },
        options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
    });
}

function saveData() {
    const date = datePicker.value;
    const data = {
        sleep: document.getElementById('sleepH').value,
        work: document.getElementById('workH').value,
        zones: []
    };
    document.querySelectorAll('.zone-row').forEach(row => {
        data.zones.push({
            name: row.querySelector('.z-name').value,
            min: row.querySelector('.z-min').value
        });
    });
    localStorage.setItem(`neytron_${date}`, JSON.stringify(data));
    alert(date + " ma'lumotlari saqlandi!");
    updateVisuals();
}

function loadSelectedDateData() {
    const date = datePicker.value;
    const saved = localStorage.getItem(`neytron_${date}`);
    document.getElementById('zones-list').innerHTML = ''; // Tozalash
    
    if(saved) {
        const data = JSON.parse(saved);
        document.getElementById('sleepH').value = data.sleep;
        document.getElementById('workH').value = data.work;
        data.zones.forEach(z => addZoneRow(z.name, z.min));
    } else {
        document.getElementById('sleepH').value = 8;
        document.getElementById('workH').value = 8;
        addZoneRow('Sport', 60);
    }
    updateVisuals();
}

window.onload = init;
</script>
</body>
</html>

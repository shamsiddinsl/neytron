<!DOCTYPE html>
<html lang="uz">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLEXD4WTZH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BLEXD4WTZH');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neytron</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #f97316; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(34, 211, 238, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* iPhone zoom oldini olish */
        input, select, textarea { font-size: 16px !important; }

        body { background: var(--bg); color: var(--text); padding: 10px; overflow-x: hidden; }
        
        #login-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: var(--bg); }
        .login-box { text-align: center; padding: 30px; border: 1px solid var(--border); border-radius: 25px; background: var(--card); }

        #main-app { display: none; max-width: 800px; margin: auto; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); margin-bottom: 15px;
        }
        #pDate { background: #000; border: 1px solid var(--border); color: var(--accent); border-radius: 8px; padding: 5px; font-weight: bold; outline: none; }
        #user-p { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); overflow: hidden; }

        .panel { background: var(--card); border-radius: 25px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .res-item { background: #030712; border-radius: 15px; padding: 12px; border: 1px solid var(--border); }
        .res-item label { font-size: 9px; opacity: 0.6; display: block; margin-bottom: 4px; }
        .res-item input { width: 100%; background: transparent; border: none; color: #fff; font-weight: bold; outline: none; }

        .zone-card { position: relative; margin-bottom: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        .p-indicator { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; }
        .p-indicator.p1 { color: var(--p1); border-color: var(--p1); }
        .p-indicator.p2 { color: var(--p2); border-color: var(--p2); }
        .p-indicator.p3 { color: var(--p3); border-color: var(--p3); }
        
        .zone-card input.name { flex: 1; background: transparent; border: none; outline: none; color: #fff; }
        .zone-card input.time { width: 65px; background: #030712; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; color: var(--accent); font-weight: bold; }

        /* Vaqt oshib ketganda qizil tebranish */
        .time-error { border-color: var(--p1) !important; animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .p-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: space-around; background: var(--card); border-radius: 15px; z-index: 10; border: 2px solid var(--accent); }
        .p-choice { font-size: 11px; font-weight: bold; cursor: pointer; }

        .chart-container { position: relative; height: 240px; margin: 10px 0; }
        .balans-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        
        .btn-run { width: 100%; padding: 16px; border: none; border-radius: 18px; background: var(--accent); color: #000; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .btn-add { width: 100%; padding: 12px; border-radius: 15px; border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-weight: bold; cursor: pointer; }

        /* Maxsus Alert Oynasi */
        #custom-alert { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .alert-box { width: 80%; max-width: 300px; background: var(--card); border: 1px solid var(--accent); border-radius: 20px; padding: 25px; text-align: center; }
    </style>
</head>
<body>

<div id="custom-alert">
    <div class="alert-box">
        <i class="fa-solid fa-circle-check" style="font-size: 40px; color: var(--p3); margin-bottom: 15px;"></i>
        <h3 id="alert-title">Muvaffaqiyatli!</h3>
        <p id="alert-msg" style="font-size: 13px; opacity: 0.7; margin: 10px 0 20px;">Ma'lumotlar saqlandi.</p>
        <button class="btn-run" onclick="closeAlert()" style="margin:0; padding:10px;">OK</button>
    </div>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color: var(--accent); letter-spacing: 3px; margin-bottom: 20px;">NEYTRON</h2>
        <button class="btn-run" onclick="window.signIn()">Google bilan kirish</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div style="font-weight: 900; color: var(--accent); font-size: 18px;">NEYTRON</div>
        <div class="header-right">
            <input type="date" id="pDate" onchange="window.loadData()">
            <div id="user-p"></div>
        </div>
    </header>

    <div class="dashboard">
        <section class="panel">
            <div class="res-grid">
                <div class="res-item"><label>UYQU (SOAT)</label><input type="number" id="sH" value="8" onchange="updateUI()"></div>
                <div class="res-item"><label>ISH (SOAT)</label><input type="number" id="wH" value="8" onchange="updateUI()"></div>
            </div>
            <div id="zList"></div>
            <button class="btn-add" onclick="addZ()">+ YANGI VAZIFA</button>
            <button class="btn-run" onclick="window.saveData()">SAQLASH</button>
        </section>

        <section class="panel" style="text-align: center;">
            <div class="chart-container">
                <canvas id="nChart"></canvas>
                <div class="balans-center">
                    <h1 id="balText" style="font-size: 36px; color: var(--accent);">08:00</h1>
                    <p style="font-size: 9px; letter-spacing: 2px; opacity: 0.5;">BO'SH VAQT</p>
                </div>
            </div>
            <div id="aiHub" style="text-align: left;"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence);
    window.signIn = () => signInWithPopup(auth, provider);

    window.saveData = async () => {
        const user = auth.currentUser; if(!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));
        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        window.showAlert("Saqlandi!", "Strategik rejangiz muvaffaqiyatli bazaga kiritildi.");
    };

    window.loadData = async () => {
        const user = auth.currentUser; if (!user) return;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const d = docSnap.data();
            document.getElementById('sH').value = d.sleep;
            document.getElementById('wH').value = d.work;
            if(d.zones) d.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        }
        updateUI();
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%">`;
            window.loadData();
        }
    });
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.showAlert = (title, msg) => {
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-msg').innerText = msg;
        document.getElementById('custom-alert').style.display = 'flex';
    };
    window.closeAlert = () => document.getElementById('custom-alert').style.display = 'none';

    window.addZ = (n='', m='', p='p3') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card'; div.id = `z-${id}`; div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Vazifa nomi..." class="name" value="${n}" onchange="updateUI()">
                <input type="number" class="time" placeholder="min" value="${m}" onchange="updateUI()">
                <i class="fa-solid fa-trash" style="opacity:0.2" onclick="document.getElementById('z-${id}').remove(); updateUI();"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div class="p-choice" onclick="selP(${id},'p1')" style="color:var(--p1)">MUHIM</div>
                <div class="p-choice" onclick="selP(${id},'p2')" style="color:var(--p2)">O'RTACHA</div>
                <div class="p-choice" onclick="selP(${id},'p3')" style="color:var(--p3)">ODATIY</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };

    window.updateUI = () => {
        let sleep = (+document.getElementById('sH').value || 0) * 60;
        let work = (+document.getElementById('wH').value || 0) * 60;
        let used = sleep + work;
        
        let labels = ['Uyqu', 'Ish'], vals = [sleep, work], colors = ['#1e293b', '#334155'];
        
        document.querySelectorAll('.zone-card').forEach(z => {
            const tInput = z.querySelector('.time');
            let v = +tInput.value || 0;
            
            // 24 soatlik limit tekshiruvi
            if (used + v > 1440) {
                const maxAvailable = 1440 - used;
                v = Math.max(0, maxAvailable);
                tInput.value = v;
                tInput.classList.add('time-error');
                setTimeout(() => tInput.classList.remove('time-error'), 500);
            } else {
                tInput.classList.remove('time-error');
            }

            if (v > 0) { 
                vals.push(v); 
                labels.push(z.querySelector('.name').value || 'Vazifa'); 
                used += v; 
                colors.push(z.dataset.p === 'p1' ? '#ef4444' : z.dataset.p === 'p2' ? '#f97316' : '#10b981'); 
            }
        });
        
        const bal = 1440 - used;
        vals.push(bal); labels.push('Bo\'sh'); colors.push('rgba(34, 211, 238, 0.05)');
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;
        
        if (chart) {
            chart.data.labels = labels; chart.data.datasets[0].data = vals; chart.data.datasets[0].backgroundColor = colors; chart.update();
        } else {
            chart = new Chart(document.getElementById('nChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '80%', animation: false, plugins: { legend: { display: false } } }
            });
        }

        // Analitika
        const hub = document.getElementById('aiHub'); hub.innerHTML = '';
        document.querySelectorAll('.zone-card').forEach(z => {
            const n = z.querySelector('.name').value;
            if (n) {
                const p = z.dataset.p;
                const txt = p==='p1' ? "Muhim strategik vazifa." : p==='p2' ? "O'rtacha ustuvorlik." : "Kundalik odatiy yumush.";
                const c = p==='p1' ? "var(--p1)" : p==='p2' ? "var(--p2)" : "var(--p3)";
                hub.innerHTML += `<div style="border-left: 3px solid ${c}; padding: 5px 10px; margin-bottom: 5px; background: rgba(255,255,255,0.02); border-radius: 5px; font-size: 11px;"><b>${n}</b>: ${txt}</div>`;
            }
        });
    };
</script>
</body>
</html>

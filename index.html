<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neytron | Strategic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; --card: #0f172a; --accent: #22d3ee;
            --p1: #ef4444; --p2: #d97706; --p3: #10b981;
            --text: #f1f5f9; --border: rgba(34, 211, 238, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 10px; line-height: 1.4; overflow-x: hidden; min-height: 100vh; }
        
        #login-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); }
        .login-box { width: 92%; max-width: 400px; padding: 40px 20px; border-radius: 30px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); backdrop-filter: blur(20px); text-align: center; }

        #main-app { 
    display: none; /* Boshida yashirin turadi */
    opacity: 0;    /* Yumshoq ko'rinishi uchun */
    transition: opacity 0.5s ease;
    max-width: 1200px; 
    margin: auto; 
    padding-bottom: 30px; 
}

        /* Header dizayni pastki bloklar bilan bir xil kenglikka keltirildi */
        header { 
            position: sticky; top: 0; z-index: 100; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; border-radius: 22px; 
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); 
            backdrop-filter: blur(15px); width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .brand { color: var(--accent); font-size: 18px; font-weight: 900; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
        .atom-core { animation: spin 4s linear infinite; font-size: 22px; color: var(--accent); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #custom-alert { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); }
        .modal-box { width: 85%; max-width: 320px; background: var(--card); border: 1px solid var(--accent); border-radius: 25px; padding: 30px 20px; text-align: center; }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 1024px) { .dashboard { grid-template-columns: 420px 1fr; } }

        .panel { background: rgba(15, 23, 42, 0.7); border-radius: 25px; border: 1px solid var(--border); padding: 20px; backdrop-filter: blur(10px); }
        .label-sm { display: block; margin-bottom: 12px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; color: var(--accent); }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .res-item { background: rgba(0,0,0,0.3); border-radius: 18px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .res-item input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 18px; font-weight: 900; }

        .zone-card { position: relative; margin-bottom: 12px; padding: 12px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
        .zone-main { display: flex; align-items: center; gap: 10px; }
        
        .p-indicator { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; cursor: pointer; }
        .p-indicator.p1 { color: var(--p1); border-color: var(--p1); background: rgba(239, 68, 68, 0.1); }
        .p-indicator.p2 { color: var(--p2); border-color: var(--p2); background: rgba(217, 119, 6, 0.1); }
        .p-indicator.p3 { color: var(--p3); border-color: var(--p3); background: rgba(16, 185, 129, 0.1); }
        
        .zone-card input.name { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; font-weight: 600; }
        .zone-card input.time { width: 65px; background: #030712; border: 1px solid var(--border); border-radius: 12px; padding: 8px; text-align: center; color: var(--accent); font-weight: 900; }

        .chart-container { position: relative; height: 280px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .balans-center { position: absolute; text-align: center; }
        .balans-center h1 { font-size: 48px; font-weight: 900; color: var(--accent); line-height: 1; }
        
        .btn-run { width: 100%; margin-top: 15px; padding: 18px; border: none; border-radius: 20px; background: linear-gradient(135deg, #22d3ee, #0891b2); color: #000; font-size: 15px; font-weight: 900; cursor: pointer; }
        .btn-add { width: 100%; margin-top: 5px; padding: 15px; border-radius: 18px; border: 2px dashed rgba(255,255,255,0.1); background: transparent; color: #64748b; font-weight: 700; cursor: pointer; }

        .p-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: space-around; background: var(--card); border-radius: 20px; z-index: 10; border: 2px solid var(--accent); }
        .ai-card { padding: 15px; border-radius: 18px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border: 1px solid var(--border); border-left-width: 5px; }
    </style>
</head>
<body>

<div id="custom-alert">
    <div class="modal-box">
        <i class="fa-solid fa-circle-check" style="font-size: 40px; color: var(--accent); margin-bottom: 15px;"></i>
        <p id="modal-msg">Amal bajarildi!</p>
        <button class="btn-run" onclick="closeModal()" style="margin:0; padding:12px;">OK</button>
    </div>
</div>

<div id="login-screen">
    <div class="login-box">
        <h1 style="letter-spacing: 5px; color: var(--accent);">NEYTRON</h1>
        <button class="btn-run" onclick="window.signIn()"><i class="fa-brands fa-google"></i> Google bilan boshlash</button>
    </div>
</div>

<div id="main-app">
    <header>
        <div class="brand"><i class="fa-solid fa-atom atom-core"></i> NEYTRON</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="date" id="pDate" onchange="window.loadData()" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--accent); border-radius:10px; padding:6px 10px; font-size:11px; font-weight:800; outline:none;">
            <div id="user-p" style="width:36px; height:36px; border-radius:50%; overflow:hidden; border:2px solid var(--accent); flex-shrink: 0;"></div>
        </div>
    </header>

    <div class="dashboard">
        <section class="panel">
            <span class="label-sm">Asosiy resurslar</span>
            <div class="res-grid">
                <div class="res-item"><label style="font-size:8px; opacity:0.5;">UYQU (SOAT)</label><input type="number" id="sH" value="8" step="0.5" onchange="updateUI()"></div>
                <div class="res-item"><label style="font-size:8px; opacity:0.5;">ISH/O'QISH (SOAT)</label><input type="number" id="wH" value="8" step="0.5" onchange="updateUI()"></div>
            </div>
            <div id="zList"></div>
            <button class="btn-add" onclick="addZ()">+ YANGI ZONA</button>
            <button class="btn-run" onclick="window.saveData()">STRATEGIK SAQLASH</button>
        </section>

        <section class="panel">
            <span class="label-sm">Vaqt balansi</span>
            <div class="chart-container">
                <canvas id="nChart"></canvas>
                <div class="balans-center">
                    <h1 id="balText">08:00</h1>
                    <p style="font-size: 8px; letter-spacing: 2px; opacity: 0.5;">BO'SH VAQT</p>
                </div>
            </div>
            <div id="aiHub"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
// Pastdagi qatorda signInWithRedirect so'zi signInWithPopup ga almashdi:
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
        authDomain: "neytronplanner.firebaseapp.com",
        projectId: "neytronplanner",
        storageBucket: "neytronplanner.firebasestorage.app",
        messagingSenderId: "960758855592",
        appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence);
    window.signIn = () => signInWithRedirect(auth, provider);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.photoURL) document.getElementById('user-p').innerHTML = `<img src="${user.photoURL}" style="width:100%; height:100%; object-fit:cover;">`;
            window.loadData();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.saveData = async () => {
        const user = auth.currentUser; if(!user) return;
        const date = document.getElementById('pDate').value;
        const zones = Array.from(document.querySelectorAll('.zone-card')).map(z => ({
            n: z.querySelector('.name').value,
            t: z.querySelector('.time').value,
            p: z.dataset.p
        }));
        await setDoc(doc(db, "users", user.uid, "plans", date), {
            sleep: document.getElementById('sH').value,
            work: document.getElementById('wH').value,
            zones: zones
        });
        window.showAlert("Strategiya muvaffaqiyatli saqlandi!");
    };

    window.loadData = async () => {
        const user = auth.currentUser; if (!user) return;
        const date = document.getElementById('pDate').value;
        const docSnap = await getDoc(doc(db, "users", user.uid, "plans", date));
        document.getElementById('zList').innerHTML = '';
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('sH').value = data.sleep || 8;
            document.getElementById('wH').value = data.work || 8;
            if(data.zones) data.zones.forEach(z => window.addZ(z.n, z.t, z.p));
        }
        updateUI();
    };
</script>

<script>
    let chart;
    document.getElementById('pDate').valueAsDate = new Date();

    window.showAlert = (msg) => {
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('custom-alert').style.display = 'flex';
    };
    window.closeModal = () => document.getElementById('custom-alert').style.display = 'none';

    window.addZ = (n='', m='', p='p2') => {
        const id = Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = 'zone-card'; div.id = `z-${id}`; div.dataset.p = p;
        div.innerHTML = `
            <div class="zone-main">
                <div class="p-indicator ${p}" onclick="showP(${id})"><i class="fa-solid fa-flag"></i></div>
                <input type="text" placeholder="Maqsad..." class="name" value="${n}" onchange="updateUI()">
                <input type="number" class="time" placeholder="min" value="${m}" onchange="updateUI()">
                <i class="fa-solid fa-trash-can" style="opacity:0.3; cursor:pointer;" onclick="document.getElementById('z-${id}').remove(); updateUI();"></i>
            </div>
            <div class="p-overlay" id="ov-${id}">
                <div onclick="selP(${id},'p1')" style="color:var(--p1); font-weight:900; cursor:pointer;">P1</div>
                <div onclick="selP(${id},'p2')" style="color:var(--p2); font-weight:900; cursor:pointer;">P2</div>
                <div onclick="selP(${id},'p3')" style="color:var(--p3); font-weight:900; cursor:pointer;">P3</div>
            </div>`;
        document.getElementById('zList').appendChild(div);
        if(m) updateUI();
    };

    window.showP = (id) => document.getElementById(`ov-${id}`).style.display = 'flex';
    window.selP = (id, p) => {
        const z = document.getElementById(`z-${id}`);
        z.dataset.p = p;
        z.querySelector('.p-indicator').className = `p-indicator ${p}`;
        document.getElementById(`ov-${id}`).style.display = 'none';
        updateUI();
    };

    window.updateUI = () => {
        let sleep = (+document.getElementById('sH').value || 0) * 60;
        let work = (+document.getElementById('wH').value || 0) * 60;
        
        if (sleep > 1440) { sleep = 1440; document.getElementById('sH').value = 24; }
        if (sleep + work > 1440) { work = 1440 - sleep; document.getElementById('wH').value = work/60; }

        let total = sleep + work;
        let labels = ['Uyqu', 'Ish/O'qish'], vals = [sleep, work], colors = ['#1e293b', '#334155'];

        document.querySelectorAll('.zone-card').forEach(z => {
            let v = +z.querySelector('.time').value || 0;
            const n = z.querySelector('.name').value || 'Vazifa';
            const p = z.dataset.p;

            if (total + v > 1440) {
                v = Math.max(0, 1440 - total);
                z.querySelector('.time').value = v;
            }
            
            if (v > 0) {
                vals.push(v); labels.push(n); total += v;
                colors.push(p === 'p1' ? '#ef4444' : p === 'p2' ? '#d97706' : '#10b981');
            }
        });

        const bal = 1440 - total;
        vals.push(bal); labels.push('Bo\'sh vaqt'); colors.push('rgba(34, 211, 238, 0.05)');
        document.getElementById('balText').innerText = `${Math.floor(bal/60).toString().padStart(2,'0')}:${(bal%60).toString().padStart(2,'0')}`;

        // Sakrashni yo'qotish uchun animatsiyani o'chirib, ma'lumotni yangilaymiz
        if (chart) {
            chart.data.labels = labels;
            chart.data.datasets[0].data = vals;
            chart.data.datasets[0].backgroundColor = colors;
            chart.update('none'); // 'none' animatsiyani butunlay o'chiradi
        } else {
            chart = new Chart(document.getElementById('nChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '82%', animation: false, plugins: { legend: { display: false } } }
            });
        }

        const hub = document.getElementById('aiHub'); hub.innerHTML = '';
        if (bal > 0) {
            hub.innerHTML = `<div class="ai-card" style="border-left-color:var(--p1)">
                <p style="font-size:12px; color:#94a3b8;">Yillik potentsial yo'qotish: <b>${Math.floor((bal*365)/60)} soat</b>(${Math.floor((bal*365)/60/24)} kunga teng)</p></div>`;
        }

        document.querySelectorAll('.zone-card').forEach(z => {
            const n = z.querySelector('.name').value;
            const p = z.dataset.p;
            if (n) {
                let msg = "", color = "";
                if (p === 'p1') { msg = `"${n}" - bugungi eng muhim strategik maqsadingiz. Bor diqqatingizni shunga qarating.`; color = "var(--p1)"; }
                else if (p === 'p2') { msg = `"${n}" - o'rtacha ustuvorlikdagi vazifa. Asosiy ishlardan so'ng bajaring.`; color = "var(--p2)"; }
                else if (p === 'p3') { msg = `"${n}" - odatiy yumush. Kun oxirida bo'sh vaqt qolsa shug'ullanish tavsiya etiladi.`; color = "var(--p3)"; }
                
                hub.innerHTML += `<div class="ai-card" style="border-left-color:${color}">
                    <h6 style="font-size:10px; color:${color}; margin-bottom:5px;">STRATEGIK TAHLIL</h6>
                    <p style="font-size:11px;">${msg}</p>
                </div>`;
            }
        });
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeytronOS | v6 Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --bg: #020617; --card: #0f172a; --accent: #22d3ee; 
            --danger: #ef4444; --text: #f8fafc; --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(34, 211, 238, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .app-container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) { .app-container { grid-template-columns: 360px 1fr; } }
        .header { grid-column: 1 / -1; background: var(--card); padding: 20px; border-radius: 18px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .brand-text { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
        .brand-text span { color: var(--accent); }
        .card { background: var(--card); border-radius: 20px; padding: 22px; border: 1px solid var(--border); }
        .section-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        input { width: 100%; background: #1e293b; border: 1px solid var(--border); padding: 12px; color: #fff; border-radius: 10px; outline: none; margin-bottom: 10px; }
        .zone-row { display: grid; grid-template-columns: 1fr 70px 30px; gap: 8px; margin-bottom: 8px; }
        .btn-save { background: var(--accent); color: #020617; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; margin-top: 15px; }
        .insight-card { background: rgba(255,255,255,0.02); border-left: 4px solid var(--accent); padding: 15px; border-radius: 0 12px 12px 0; margin-bottom: 12px; }
        .insight-card strong { color: var(--accent); display: block; margin-bottom: 5px; font-size: 14px; }
        .insight-card p { font-size: 13.5px; color: #cbd5e1; line-height: 1.5; }
        .chart-box { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; }
        .center-display { position: absolute; text-align: center; }
        #balance-text { font-size: 45px; font-weight: 900; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand-text"><i class="fa-solid fa-bolt"></i> NEYTRON<span>OS</span></div>
        <input type="date" id="datePicker" style="width: auto; margin: 0; padding: 5px;">
    </header>

    <aside class="card">
        <div class="section-title"><i class="fa-solid fa-hourglass-start"></i> Asosiy Vaqt</div>
        <label style="font-size: 11px; opacity: 0.6;">UYQU (SOAT)</label>
        <input type="number" id="sleepH" value="8">
        <label style="font-size: 11px; opacity: 0.6;">MAJBURIYATLAR (SOAT)</label>
        <input type="number" id="workH" value="8">

        <div class="section-title" style="margin-top: 20px;"><i class="fa-solid fa-list-check"></i> Maxsus Zonalar</div>
        <div id="zones-area"></div>
        <button onclick="addZone()" style="background: none; border: 1px dashed var(--accent); color: var(--accent); width: 100%; padding: 10px; border-radius: 10px; cursor: pointer;">+ Zona qo'shish</button>
        
        <button class="btn-save" onclick="saveAndAnalyze()"><i class="fa-solid fa-brain"></i> TAHLIL VA SAQLASH</button>
    </aside>

    <main>
        <div class="card" style="margin-bottom: 20px;">
            <div class="chart-box">
                <canvas id="mainChart"></canvas>
                <div class="center-display">
                    <div id="balance-text">00:00</div>
                    <p style="font-size: 10px; opacity: 0.5;">BO'SH BALANS</p>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="section-title"><i class="fa-solid fa-microchip"></i> Neytron Analitika Markazi</div>
            <div id="insights-output"></div>
        </div>
    </main>
</div>

<script>
let chart;
const dateEl = document.getElementById('datePicker');
dateEl.valueAsDate = new Date();

function addZone(n = '', v = '') {
    const div = document.createElement('div');
    div.className = 'zone-row';
    div.innerHTML = `<input type="text" placeholder="Nom" value="${n}" class="zn"><input type="number" placeholder="Min" value="${v}" class="zv"><button onclick="this.parentElement.remove(); updateUI()" style="background:none; color:var(--danger); border:none; cursor:pointer;">×</button>`;
    document.getElementById('zones-area').appendChild(div);
    div.querySelectorAll('input').forEach(i => i.oninput = updateUI);
    updateUI();
}

function updateUI() {
    const s = (+document.getElementById('sleepH').value || 0) * 60;
    const w = (+document.getElementById('workH').value || 0) * 60;
    let labels = ['Uyqu', 'Majburiyat'], values = [s, w], zTotal = 0;
    document.querySelectorAll('.zone-row').forEach(r => {
        const n = r.querySelector('.zn').value || 'Zona', v = +r.querySelector('.zv').value || 0;
        if(v > 0) { labels.push(n); values.push(v); zTotal += v; }
    });
    const free = 1440 - (s + w + zTotal);
    document.getElementById('balance-text').innerText = `${Math.floor(Math.abs(free)/60).toString().padStart(2,'0')}:${(Math.abs(free)%60).toString().padStart(2,'0')}`;
    labels.push('Bo\'sh'); values.push(free > 0 ? free : 0);
    if(chart) chart.destroy();
    chart = new Chart(document.getElementById('mainChart'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: ['#1e293b', '#334155', '#22d3ee', '#3b82f6', '#8b5cf6', '#ec4899', '#10b981'], borderWidth: 0, cutout: '80%' }] },
        options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
    });
}

function saveAndAnalyze() {
    const s = document.getElementById('sleepH').value, w = document.getElementById('workH').value;
    const z = Array.from(document.querySelectorAll('.zone-row')).map(r => ({n: r.querySelector('.zn').value, v: r.querySelector('.zv').value}));
    localStorage.setItem(`n_v6_${dateEl.value}`, JSON.stringify({s, w, z}));
    
    const output = document.getElementById('insights-output');
    output.innerHTML = '';
    const freeMin = 1440 - ((s*60)+(w*60)+z.reduce((a,b)=>a+(+b.v||0),0));

    // 1. VAQT O'G'RISI TAHLILI
    const waste = z.find(i => ['yo\'l', 'yol', 'transport', 'kutish', 'ijtimoiy'].some(k => i.n.toLowerCase().includes(k)));
    if (waste && waste.v > 0) {
        const yH = Math.floor((waste.v * 365) / 60);
        output.innerHTML += `<div class="insight-card" style="border-left-color: var(--danger)"><strong>Vaqt O'g'risi: ${waste.n}</strong><p>Siz yiliga <b>${yH} soat</b> vaqtingizni ushbu zonada yo'qotyapsiz. Agar bu vaqtda bilim olsangiz (audiokitob), yiliga qo'shimcha <b>${Math.floor(yH/4)} ta kitob</b> o'qigan bo'lar edingiz.</p></div>`;
    }

    // 2. KITOB ANALITIKASI (Zarbdor fakt)
    const kitob = z.find(i => i.n.toLowerCase().includes('kitob'));
    if (kitob && kitob.v > 0) {
        const bCount = Math.floor((kitob.v * 365) / 250); // 1 daqiqa = 1 bet, 250 betlik kitob
        output.innerHTML += `<div class="insight-card"><strong>Bilim Kapitali: Kitobxonlik</strong><p>Kunlik ${kitob.v} daqiqa bilan yiliga <b>${bCount} ta kitob</b> tugatasiz. Status: <b>${bCount > 24 ? 'Professional Kitobxon' : 'Havasakor'}</b>.</p></div>`;
    }

    // 3. BO'SH VAQTNI FOYDALIGA O'TKAZISH
    if (freeMin > 0) {
        const yD = Math.floor((freeMin * 365) / 1440);
        output.innerHTML += `<div class="insight-card"><strong>Vaqt Inflyatsiyasi</strong><p>Sizda yiliga <b>${yD} sutka</b> nazoratsiz bo'sh vaqt bor. Ushbu vaqtni "Foydali Zonalar"ga o'tkazish hayotingizni 10 barobar tezlashtiradi.</p></div>`;
    }
}

function load() {
    const saved = JSON.parse(localStorage.getItem(`n_v6_${dateEl.value}`));
    document.getElementById('zones-area').innerHTML = '';
    if(saved) {
        document.getElementById('sleepH').value = saved.s;
        document.getElementById('workH').value = saved.w;
        saved.z.forEach(z => addZone(z.n, z.v));
    } else { addZone('Kitob o\'qish', 30); }
    updateUI();
}
window.onload = load;
dateEl.onchange = load;
</script>
</body>
</html>

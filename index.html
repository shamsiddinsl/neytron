<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neytron | Beta System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
:root{
--bg:#030712;
--card:#0f172a;
--accent:#22d3ee;
--text:#f1f5f9;
--border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);padding:15px;}

/* LOADING */
#loading{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#030712;z-index:9999;
}

.loader{
width:60px;height:60px;border:4px solid #222;
border-top:4px solid var(--accent);
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#020617;
}

.box{
background:var(--card);
padding:40px;
border-radius:20px;
text-align:center;
border:1px solid var(--border);
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

/* APP */
#app{display:none;max-width:1000px;margin:auto;}

header{
display:flex;justify-content:space-between;
padding:12px;
background:var(--card);
border-radius:15px;
border:1px solid var(--border);
margin-bottom:15px;
}

.panel{
background:var(--card);
padding:15px;
border-radius:15px;
margin-bottom:15px;
border:1px solid var(--border);
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:1px solid #222;
background:#020617;
color:white;
}

.task{
display:flex;
gap:10px;
margin-top:10px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--accent);
color:#000;
padding:10px 20px;
border-radius:10px;
opacity:0;
transition:0.3s;
}
.toast.show{opacity:1;bottom:40px;}

</style>
</head>
<body>

<div id="loading"><div class="loader"></div></div>

<div id="login">
<div class="box">
<h2>Neytron</h2>
<p>Login orqali kirish</p>
<br>
<button onclick="login()">Google Login</button>
</div>
</div>

<div id="app">

<header>
<div><b>NEYTRON</b></div>
<button onclick="logout()">Chiqish</button>
</header>

<div class="panel">
<h3>Kun rejasi</h3>

<input id="taskName" placeholder="Vazifa">
<input id="taskTime" type="number" placeholder="Vaqt (min)">

<button onclick="addTask()">Qo‘shish</button>

<div id="tasks"></div>
</div>

<div class="panel">
<h3>Analitika</h3>
<canvas id="chart"></canvas>
</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDEqZaUxiEffhuNChwMYvNDi_T8xbPn5Oc",
authDomain: "neytronplanner.firebaseapp.com",
projectId: "neytronplanner",
storageBucket: "neytronplanner.firebasestorage.app",
messagingSenderId: "960758855592",
appId: "1:960758855592:web:bf7c16fea616e75df54f9d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.login = () => {
signInWithPopup(auth, provider)
.catch(e => showToast("Login xatolik"));
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user)=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}else{
document.getElementById("login").style.display="flex";
document.getElementById("app").style.display="none";
}
document.getElementById("loading").style.display="none";
});

</script>

<script>

let tasks=[];

window.addTask=()=>{

const name=document.getElementById("taskName").value;
const time=document.getElementById("taskTime").value;

if(!name || !time) return showToast("To‘ldiring");

tasks.push({name,time});

render();

showToast("Qo‘shildi");
};

function render(){

let html="";

tasks.forEach(t=>{
html+=`<div class="task">
<div>${t.name}</div>
<div>${t.time} min</div>
</div>`;
});

document.getElementById("tasks").innerHTML=html;
updateChart();
}

let chart;

function updateChart(){

let labels=tasks.map(t=>t.name);
let data=tasks.map(t=>t.time);

if(!chart){
chart=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels,
datasets:[{data}]
}
});
}else{
chart.data.labels=labels;
chart.data.datasets[0].data=data;
chart.update();
}
}

function showToast(text){
let t=document.getElementById("toast");
t.innerText=text;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

window.addEventListener("load",()=>{
setTimeout(()=>{
document.getElementById("loading").style.display="none";
},800);
});

</script>

</body>
</html>
